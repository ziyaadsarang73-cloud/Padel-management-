<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PADELPILOT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- html2canvas for screenshot / save -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: white;
            color: #1e3a8a; /* blue accents */
        }

        .banner {
            background-color: #1e3a8a; /* deep blue */
            color: white;
            font-weight: bold;
            font-size: 2rem;
            text-align: center;
            padding: 1rem;
            position: relative;
        }

        .banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #39ff14; /* neon green horizontal strip */
        }

        .tab {
            display: none;
        }

        .active-tab {
            display: block;
        }

        .tab-button {
            cursor: pointer;
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            background-color: #1e3a8a;
            color: white;
        }

        .tab-button.active {
            background-color: #39ff14; /* neon green highlight for active tab */
            color: black;
        }

        .background-container {
            background-image: url('59431.jpg');
            background-size: cover;
            background-position: center;
            min-height: calc(100vh - 90px);
            padding: 1rem;
        }

        .mascot-img {
            max-width: 200px;
        }

        /* Scrollable content for Lab and Arena */
        .scrollable {
            max-height: 500px;
            overflow-y: auto;
            padding: 0.5rem;
            background-color: rgba(255,255,255,0.9);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Banner -->
    <div class="banner">
        PADELPILOT
    </div>

    <!-- Tabs -->
    <div class="flex justify-center mt-4">
        <button class="tab-button active" onclick="switchTab('arena')">Arena</button>
        <button class="tab-button" onclick="switchTab('lab')">Lab</button>
        <button class="tab-button" onclick="switchTab('hub')">Hub</button>
    </div>

    <div class="background-container mt-4">
        <!-- Arena Tab -->
        <div id="arena" class="tab active-tab">
            <h2 class="text-xl font-bold mb-2">Arena</h2>
            <textarea id="playersInput" rows="4" class="w-full p-2 rounded border" placeholder="Enter player names separated by commas"></textarea>
            <button onclick="savePlayers()" class="mt-2 px-4 py-2 bg-blue-700 text-white rounded hover:bg-blue-900">Save Players</button>
            <button onclick="generateMatch()" class="mt-2 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-800">Generate Match</button>
            <div id="matchOutput" class="mt-4 scrollable"></div>
        </div>

        <!-- Lab Tab -->
        <div id="lab" class="tab">
            <h2 class="text-xl font-bold mb-2">Lab</h2>
            <div class="scrollable">
                <p>Experimental features / stats / sandbox go here.</p>
            </div>
        </div>

        <!-- Hub Tab -->
        <div id="hub" class="tab">
            <h2 class="text-xl font-bold mb-2">Hub</h2>
            <img src="60117.jpg" alt="Mascot" class="mascot-img mb-4">
            <div class="scrollable">
                <p>Tournament hub, team info, or leaderboard display goes here.</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
            projectId: "padelpilot-4531f",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active-tab'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active-tab');
            document.querySelector(`.tab-button[onclick="switchTab('${tabId}')"]`).classList.add('active');
        }

        // Save players to Firebase
        function savePlayers() {
            const players = document.getElementById('playersInput').value;
            if(players.trim() === "") { alert("Enter player names!"); return; }
            database.ref('players').set({
                list: players,
                updatedAt: Date.now()
            }).then(() => alert("Players saved!"));
        }

        // Load players on startup
        database.ref('players/list').once('value').then(snapshot => {
            const val = snapshot.val();
            if(val) document.getElementById('playersInput').value = val;
        });

        // Generate match
        function generateMatch() {
            const players = document.getElementById('playersInput').value.split(',').map(p => p.trim()).filter(Boolean);
            if(players.length < 4) { alert("Enter at least 4 players!"); return; }
            shuffleArray(players);
            const matchText = `Match: ${players[0]} & ${players[1]} VS ${players[2]} & ${players[3]}`;
            document.getElementById('matchOutput').innerText = matchText;

            // Save match to Firebase
            const matchId = 'match_' + Date.now();
            database.ref('matches/' + matchId).set({
                players: matchText,
                createdAt: Date.now()
            });
        }

        // Shuffle helper
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 48-hour reset of matches
        database.ref('matches').once('value').then(snapshot => {
            snapshot.forEach(child => {
                const match = child.val();
                if(Date.now() - match.createdAt > 48*60*60*1000) {
                    database.ref('matches/' + child.key).remove();
                }
            });
        });
    </script>
</body>
</html>
