<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="banner">
  PADELPILOT
</div>

<div class="container">

  <div class="card">
    <h2>Add Player</h2>
    <input id="playerName" placeholder="Player Name"/>
    <button onclick="addPlayer()">Add</button>
  </div>

  <div class="card">
    <h2>Generate Matches</h2>
    <button onclick="generateMatches()">Create Round</button>
    <div id="matches"></div>
  </div>

  <div class="card">
    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>
  </div>

</div>

<script src="firebase.js"></script>
<script src="auth.js"></script>
<script src="tournaments.js"></script>
<script src="invites.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
