<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PadelPilot Arena</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --blue:#0A3D91;
      --lightBlue:#1F6BFF;
      --green:#39FF14;
      --white:#ffffff;
      --bg:#f7f9fc;
    }

    body {
      margin:0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color:#111;
    }

    /* DYNAMIC TOP BANNER */
    .banner {
      background: var(--blue);
      color:white;
      padding:18px 20px;
      text-align:center;
      position:relative;
      font-weight:800;
      font-size:28px;
      letter-spacing:.5px;
    }

    .banner::after {
      content:"";
      position:absolute;
      left:0;
      right:0;
      height:6px;
      background:var(--green);
      bottom:0;
    }

    .container {
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    .card {
      background:white;
      border-radius:14px;
      padding:18px;
      box-shadow:0 8px 24px rgba(0,0,0,0.05);
      margin-bottom:20px;
    }

    h2 {
      margin-top:0;
      color:var(--blue);
    }

    button {
      background:var(--lightBlue);
      color:white;
      border:none;
      padding:12px 16px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }

    button:hover {
      opacity:.92;
    }

    input {
      padding:10px;
      border-radius:8px;
      border:1px solid #ddd;
      width:100%;
      margin-bottom:10px;
    }

    .match {
      border:1px solid #eee;
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
    }

    .leaderboard-row {
      display:flex;
      justify-content:space-between;
      padding:10px 0;
      border-bottom:1px solid #f1f1f1;
    }
  </style>
</head>

<body>

<div class="banner">
  PADELPILOT
</div>

<div class="container">

  <!-- PLAYER ADD -->
  <div class="card">
    <h2>Add Player</h2>
    <input id="playerName" placeholder="Player name"/>
    <button onclick="addPlayer()">Add</button>
  </div>

  <!-- MATCH GENERATOR -->
  <div class="card">
    <h2>Generate Matches</h2>
    <button onclick="generateMatches()">Create Round</button>
    <div id="matches"></div>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>
  </div>

</div>

<script>
/* ---------------- FIREBASE CONFIG ---------------- */

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------------- PLAYERS ---------------- */

let players = [];

function addPlayer(){
  const name = document.getElementById('playerName').value;
  if(!name) return;

  db.collection("players").add({
    name,
    score:0,
    createdAt: Date.now()
  });

  document.getElementById('playerName').value="";
}

/* ---------------- REALTIME LOAD ---------------- */

db.collection("players").onSnapshot(snapshot=>{
  players = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  renderLeaderboard();
});

/* ---------------- MATCH GENERATOR ---------------- */

function generateMatches(){

  const shuffled = [...players].sort(()=>0.5 - Math.random());
  const matches = [];

  for(let i=0; i+3<shuffled.length; i+=4){
    matches.push({
      players:[
        shuffled[i],
        shuffled[i+1],
        shuffled[i+2],
        shuffled[i+3]
      ],
      createdAt: Date.now()
    });
  }

  matches.forEach(m=>{
    db.collection("matches").add(m);
  });

}

/* ---------------- MATCH DISPLAY ---------------- */

db.collection("matches").onSnapshot(snapshot=>{
  const container = document.getElementById("matches");
  container.innerHTML="";

  snapshot.docs.forEach(doc=>{
    const m = doc.data();
    const div = document.createElement("div");
    div.className="match";
    div.innerHTML = m.players.map(p=>p.name).join(" vs ");
    container.appendChild(div);
  });
});

/* ---------------- LEADERBOARD ---------------- */

function renderLeaderboard(){
  const lb = document.getElementById("leaderboard");
  lb.innerHTML="";

  players.sort((a,b)=>b.score-a.score)
  .forEach(p=>{
    const row = document.createElement("div");
    row.className="leaderboard-row";
    row.innerHTML = `<span>${p.name}</span><span>${p.score}</span>`;
    lb.appendChild(row);
  });
}

/* ---------------- AUTO RESET INVITES AFTER 48H ---------------- */

/*
This checks match documents and deletes any older than 48 hours.
Runs on page load + every time matches update.
*/

const HOURS_48 = 48 * 60 * 60 * 1000;

async function resetOldInvites(){

  const snapshot = await db.collection("matches").get();

  snapshot.forEach(doc=>{
    const match = doc.data();

    if(match.createdAt && Date.now() - match.createdAt > HOURS_48){
      db.collection("matches").doc(doc.id).delete();
    }
  });

}

// run once
resetOldInvites();

// run every 10 mins
setInterval(resetOldInvites, 600000);

</script>

</body>
</html>
