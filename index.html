<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PadelPilot Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
        
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        
        /* THE NEON LOOK */
        .neon-border-volt { border: 2px solid #e1ff00; box-shadow: 0 0 15px rgba(225, 255, 0, 0.3); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* DYNAMIC BANNERS */
        #mainBanner { transition: all 0.5s ease-in-out; height: 180px; }
        .bg-arena { background: linear-gradient(to bottom, rgba(2,6,23,0.4), #020617), url('arena-bg.jpg'); background-size: cover; }
        .bg-lab { background: linear-gradient(to bottom, rgba(2,6,23,0.4), #020617), url('lab-bg.jpg'); background-size: cover; }
        
        /* BOTTOM NAV */
        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 100; }
        
        .check-in-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body>

    <div id="mainBanner" class="bg-arena flex flex-col items-center justify-center p-6 text-center">
        <h1 id="bannerTitle" class="text-4xl font-black italic tracking-tighter text-yellow-400">THE ARENA</h1>
        <p id="bannerSubtitle" class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-70">Live Match Control</p>
    </div>

    <div class="p-4 pb-32 max-w-2xl mx-auto">
        
        <div id="viewArena" class="tab-view space-y-4">
            <div class="glass-card p-5 rounded-[2rem] neon-border-volt">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span class="text-[10px] font-bold text-yellow-400 uppercase">📍 Location</span>
                        <h2 id="displayLoc" class="text-xl font-bold uppercase">Constantia Courts</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-bold text-yellow-400 uppercase">⏰ Time</span>
                        <h2 id="displayTime" class="text-xl font-bold uppercase">10:00 AM</h2>
                    </div>
                </div>
                <button onclick="checkIn()" class="w-full bg-green-500 text-white font-black py-4 rounded-2xl uppercase italic shadow-lg hover:scale-105 transition-transform">
                    I'm at the court! 🎾
                </button>
            </div>
            </div>

        <div id="viewLab" class="tab-view hidden space-y-4">
            <div id="authCheck" class="text-center py-20">
                <img src="racky-guard.png" class="w-24 mx-auto mb-4 opacity-50">
                <h3 class="font-bold uppercase tracking-widest text-sm mb-4">Trainer Credentials Required</h3>
                <button onclick="showLogin()" class="bg-cyan-500 px-8 py-3 rounded-full font-black text-xs">LOGIN AS TRAINER</button>
            </div>
            </div>

    </div>

    <div class="nav-dock glass-card p-2 rounded-[2.5rem] flex justify-around items-center">
        <button onclick="switchTab('arena')" class="flex flex-col items-center p-3">
            <span class="text-xl">🎾</span>
            <span class="text-[8px] font-bold uppercase mt-1 text-yellow-400">Arena</span>
        </button>
        <button onclick="switchTab('lab')" class="flex flex-col items-center p-3 opacity-50">
            <span class="text-xl">📊</span>
            <span class="text-[8px] font-bold uppercase mt-1">The Lab</span>
        </button>
        <button onclick="switchTab('tourney')" class="flex flex-col items-center p-3 opacity-50">
            <span class="text-xl">🏆</span>
            <span class="text-[8px] font-bold uppercase mt-1">Tourney</span>
        </button>
        <button onclick="switchTab('racky')" class="flex flex-col items-center p-3 opacity-50">
            <span class="text-xl">🤖</span>
            <span class="text-[8px] font-bold uppercase mt-1">Racky</span>
        </button>
    </div>

    <script>
        // CONFIG & TABS logic
        function switchTab(tab) {
            // 1. Update UI Elements
            document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
            const banner = document.getElementById('mainBanner');
            const title = document.getElementById('bannerTitle');
            
            if(tab === 'arena') {
                document.getElementById('viewArena').classList.remove('hidden');
                banner.className = 'bg-arena flex flex-col items-center justify-center p-6 text-center';
                title.innerText = 'THE ARENA';
                title.className = 'text-4xl font-black italic tracking-tighter text-yellow-400';
            } 
            else if(tab === 'lab') {
                document.getElementById('viewLab').classList.remove('hidden');
                banner.className = 'bg-lab flex flex-col items-center justify-center p-6 text-center';
                title.innerText = 'TRAINER LAB';
                title.className = 'text-4xl font-black italic tracking-tighter text-cyan-400';
            }
            // Add other tab transitions here...
        }

        function checkIn() {
            alert("Racky sees you! You're checked in. 🚀");
            // Add Firebase push logic here
        }
    </script>
</body>
</html>
