<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadelPilot Pro - High Energy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-volt { color: #e1ff00; }
        .bg-neon-volt { background-color: #e1ff00; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 100; }
    </style>
</head>
<body class="pb-24">

    <div id="arena" class="tab-content active-tab">
        <div class="p-8 text-center bg-slate-900 border-b border-white/10 mb-6">
            <h1 class="text-4xl font-black italic tracking-tighter neon-volt">THE ARENA</h1>
            <p class="text-[10px] uppercase tracking-widest opacity-60">Live Match Control</p>
        </div>

        <div class="max-w-md mx-auto px-4 space-y-6">
            <div class="glass p-5 rounded-3xl border-2 border-[#e1ff00]/30">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <p class="text-[10px] font-bold neon-volt uppercase">📍 Location</p>
                        <h2 id="locDisplay" class="text-lg font-bold">Padel Hub</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold neon-volt uppercase">⏰ Time</p>
                        <h2 id="timeDisplay" class="text-lg font-bold">09:00 AM</h2>
                    </div>
                </div>
                <button onclick="checkIn()" id="checkBtn" class="w-full bg-green-500 text-black font-black py-3 rounded-xl uppercase italic shadow-lg">I'm at the court! 🎾</button>
            </div>

            <div class="glass p-4 rounded-2xl flex gap-2">
                <input type="text" id="playerName" placeholder="Player Name..." class="flex-1 bg-transparent border-b border-white/20 outline-none p-2">
                <button onclick="addPlayer()" class="bg-neon-volt text-black font-black px-6 py-2 rounded-xl uppercase text-xs">Add</button>
            </div>

            <div id="leaderboard" class="space-y-2"></div>

            <button onclick="generateRounds()" class="w-full bg-blue-600 font-black py-4 rounded-2xl uppercase italic shadow-xl">Generate Next Round 🚀</button>
            
            <div id="matchDisplay" class="space-y-3"></div>
        </div>
    </div>

    <div id="lab" class="tab-content">
        <div class="p-8 text-center bg-slate-900 border-b border-cyan-400/30 mb-6">
            <h1 class="text-4xl font-black italic tracking-tighter text-cyan-400">TRAINER LAB</h1>
        </div>
        <div class="flex flex-col items-center justify-center pt-20">
            <span class="text-6xl mb-4">🔒</span>
            <button onclick="alert('Login Required')" class="bg-cyan-500 text-black font-black px-8 py-3 rounded-full uppercase">Trainer Login</button>
        </div>
    </div>

    <div id="racky" class="tab-content">
        <div class="p-8 text-center bg-slate-900 border-b border-green-400/30 mb-6">
            <h1 class="text-4xl font-black italic tracking-tighter text-green-400">ASK RACKY</h1>
        </div>
        <div class="px-4 text-center">
            <div class="text-6xl animate-bounce mb-4">🤖</div>
            <p class="opacity-70 italic">"Ready to check the rules, Coach!"</p>
        </div>
    </div>

    <div class="nav-dock glass p-2 rounded-[2.5rem] flex justify-around items-center">
        <button onclick="showTab('arena')" class="p-3 flex flex-col items-center">
            <span class="text-xl">🎾</span>
            <span class="text-[8px] font-bold uppercase mt-1 neon-volt">Arena</span>
        </button>
        <button onclick="showTab('lab')" class="p-3 flex flex-col items-center">
            <span class="text-xl">📊</span>
            <span class="text-[8px] font-bold uppercase mt-1">Lab</span>
        </button>
        <button onclick="showTab('racky')" class="p-3 flex flex-col items-center">
            <span class="text-xl">🤖</span>
            <span class="text-[8px] font-bold uppercase mt-1">Racky</span>
        </button>
    </div>

    <script>
        // --- DATA ---
        let players = [];

        // --- CORE FUNCTIONS (Last Night's Logic) ---
        function addPlayer() {
            const name = document.getElementById('playerName').value;
            if (name) {
                players.push({ name: name, points: 0 });
                document.getElementById('playerName').value = '';
                updateLeaderboard();
            }
        }

        function updateLeaderboard() {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = '<p class="text-[10px] font-bold opacity-40 uppercase tracking-widest ml-2">Leaderboard</p>';
            players.sort((a,b) => b.points - a.points).forEach(p => {
                lb.innerHTML += `
                    <div class="glass p-3 rounded-xl flex justify-between">
                        <span class="font-bold">${p.name}</span>
                        <span class="neon-volt font-bold">${p.points} XP</span>
                    </div>
                `;
            });
        }

        function generateRounds() {
            if(players.length < 4) return alert("Need 4 players!");
            const shuffled = [...players].sort(() => 0.5 - Math.random());
            const display = document.getElementById('matchDisplay');
            display.innerHTML = '<p class="text-[10px] font-bold opacity-40 uppercase tracking-widest ml-2">Matches</p>';
            
            for(let i=0; i < Math.floor(shuffled.length/4); i++) {
                const t1 = [shuffled[i*4], shuffled[i*4+1]];
                const t2 = [shuffled[i*4+2], shuffled[i*4+3]];
                display.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center text-sm">
                        <button onclick="win('${t1[0].name}','${t1[1].name}')" class="text-center w-5/12">${t1[0].name} & ${t1[1].name} <br> <span class="text-[10px] neon-volt uppercase">[Win]</span></button>
                        <div class="italic opacity-20">VS</div>
                        <button onclick="win('${t2[0].name}','${t2[1].name}')" class="text-center w-5/12">${t2[0].name} & ${t2[1].name} <br> <span class="text-[10px] neon-volt uppercase">[Win]</span></button>
                    </div>
                `;
            }
        }

        function win(p1, p2) {
            players.forEach(p => { if(p.name === p1 || p.name === p2) p.points += 10; });
            updateLeaderboard();
        }

        // --- NEW APP FEATURES ---
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
        }

        function checkIn() {
            document.getElementById('checkBtn').innerText = "ARRIVED ✅";
            document.getElementById('checkBtn').classList.replace('bg-green-500', 'bg-slate-700');
            document.getElementById('checkBtn').classList.add('text-white');
        }
    </script>
</body>
</html>
