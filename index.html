<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadelPilot Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { background-color: #0f172a; color: white; margin: 0; font-family: sans-serif; overflow-x: hidden; }
        .master-bg {
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.98)), url('59431.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh;
        }
        .tab-active { background: #fbbf24; color: #0f172a; border-radius: 12px; transform: scale(1.05); }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .racky-bounce { animation: bounce 3s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>
    <div class="master-bg p-4 pb-20">

    <div class="max-w-5xl mx-auto flex items-center gap-4 mb-6 glass-panel p-4 rounded-3xl">
        <div class="racky-bounce">
            <img src="59464.jpg" alt="Racky" class="w-14 h-14 rounded-full border-2 border-yellow-400 object-cover">
        </div>
        <div class="flex-1">
            <h1 class="text-2xl font-black italic uppercase leading-none">Padel<span class="text-yellow-400">Pilot</span></h1>
            <p id="mascotText" class="text-yellow-200 text-[10px] font-bold italic">"Ready for a pro session?"</p>
        </div>
        <div class="flex bg-black/40 p-1 rounded-15px border border-white/10">
            <button id="tabArenaBtn" onclick="switchTab('arena')" class="px-4 py-2 text-[10px] font-black uppercase transition-all tab-active">🎾 Arena</button>
            <button id="tabLabBtn" onclick="switchTab('lab')" class="px-4 py-2 text-[10px] font-black uppercase transition-all">📊 The Lab</button>
        </div>
    </div>

    <div id="arenaView" class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="glass-panel p-6 rounded-3xl">
            <h3 class="text-xs font-bold uppercase text-blue-400 mb-4 tracking-widest">Tournament Settings</h3>
            <input id="meetNameInput" type="text" class="w-full bg-black/50 border border-gray-700 p-3 rounded-xl mb-3 text-sm outline-none focus:border-blue-400" placeholder="Meet Name (e.g. SaturdayCup)">
            <button id="connectMeetBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-[10px] uppercase mb-4">Connect to Cloud</button>
            
            <textarea id="playersInput" class="w-full bg-black/50 border border-gray-700 p-3 rounded-xl h-40 text-sm outline-none focus:border-yellow-400" placeholder="Player list..."></textarea>
            <button id="savePlayersBtn" class="w-full mt-2 bg-green-600/80 text-white font-bold py-2 rounded-xl text-[10px] uppercase mb-4">💾 Sync Squad</button>
            
            <div class="grid grid-cols-2 gap-3">
                <input id="courtsInput" type="number" value="1" class="bg-black/50 p-2 rounded-lg border border-gray-700 text-white text-center">
                <select id="modeSelect" class="bg-black/50 p-2 rounded-lg border border-gray-700 text-xs">
                    <option value="classic">Classic</option>
                    <option value="americano">Americano</option>
                </select>
            </div>
            <button id="generateBtn" class="w-full mt-6 bg-yellow-400 text-blue-900 font-black py-3 rounded-xl uppercase shadow-lg">Generate Round</button>
        </div>

        <div class="md:col-span-2 space-y-4">
            <div id="matchesContainer" class="grid grid-cols-1 gap-3"></div>
            <div id="leaderboardSection" class="hidden glass-panel rounded-3xl overflow-hidden shadow-2xl">
                <div class="p-4 bg-gray-800/50 flex justify-between items-center border-b border-white/5">
                    <span class="font-bold text-xs tracking-widest uppercase">🏆 Standings</span>
                    <button onclick="downloadResults()" class="text-[9px] bg-white/10 px-3 py-1 rounded-full font-bold uppercase border border-white/10">Export Standings</button>
                </div>
                <table class="w-full text-left text-sm"><tbody id="leaderboardBody"></tbody></table>
            </div>
        </div>
    </div>

    <div id="labView" class="hidden max-w-5xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="space-y-6">
                <div class="glass-panel p-6 rounded-3xl border-l-4 border-green-500">
                    <h3 class="text-xs font-bold uppercase text-green-400 mb-2">Trainer Revenue</h3>
                    <p class="text-[10px] text-gray-400 mb-4">Track your session earnings</p>
                    <div class="bg-black/40 p-4 rounded-2xl text-center">
                        <span class="text-3xl font-black text-white" id="totalIncome">R0</span>
                        <p class="text-[10px] text-green-500 font-bold uppercase mt-1 tracking-tighter italic">Total Collected</p>
                    </div>
                    <button onclick="resetLedger()" class="w-full mt-4 text-[9px] text-red-400 font-bold uppercase opacity-50 hover:opacity-100">Reset Ledger</button>
                </div>
            </div>

            <div class="md:col-span-3 glass-panel p-6 rounded-3xl">
                <h3 class="text-xs font-bold uppercase text-yellow-400 mb-4 tracking-widest">Student Management & Feedback</h3>
                <div id="trainerStudentList" class="space-y-3">
                    <p class="text-gray-500 text-center italic text-xs py-10">Add players in the 'Arena' tab to see trainer controls here.</p>
                </div>
            </div>
        </div>
    </div>

    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
            authDomain: "padelpilot-4531f.firebaseapp.com",
            databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
            projectId: "padelpilot-4531f",
            storageBucket: "padelpilot-4531f.appspot.com",
            messagingSenderId: "866905934997",
            appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let players = []; let matches = []; let activeMeetId = ''; let ledger = {};

        // TAB SWITCHER LOGIC
        function switchTab(tab) {
            document.getElementById('arenaView').classList.toggle('hidden', tab !== 'arena');
            document.getElementById('labView').classList.toggle('hidden', tab !== 'lab');
            document.getElementById('tabArenaBtn').classList.toggle('tab-active', tab === 'arena');
            document.getElementById('tabLabBtn').classList.toggle('tab-active', tab === 'lab');
            if(tab === 'lab') renderTrainerLab();
        }

        // CONNECT & SYNC
        document.getElementById('connectMeetBtn').onclick = () => {
            const name = document.getElementById('meetNameInput').value.trim().toLowerCase();
            if(!name) return alert("Enter Meet Name!");
            activeMeetId = name;
            db.ref('meets/' + activeMeetId).on('value', (s) => {
                const d = s.val();
                if(d && d.players) {
                    document.getElementById('playersInput').value = d.players;
                    players = d.players.split('\n').filter(p => p.trim());
                    document.getElementById('mascotText').textContent = '"Connected to ' + activeMeetId + '! ☁️"';
                }
            });
        };

        document.getElementById('savePlayersBtn').onclick = () => {
            if(!activeMeetId) return alert("Connect first!");
            const list = document.getElementById('playersInput').value;
            db.ref('meets/' + activeMeetId).update({ players: list });
            alert("Squad Saved!");
        };

        // TRAINER LAB ENGINE
        function renderTrainerLab() {
            const container = document.getElementById('trainerStudentList');
            if(players.length === 0) return;
            
            container.innerHTML = players.map(p => {
                const isPaid = ledger[p] ? 'bg-green-500' : 'bg-gray-700';
                return `
                    <div class="bg-black/40 p-4 rounded-2xl flex flex-col gap-3 border border-white/5">
                        <div class="flex justify-between items-center">
                            <span class="font-black uppercase text-sm">${p}</span>
                            <div class="flex gap-2">
                                <button onclick="togglePaid('${p}')" class="${isPaid} text-[9px] px-3 py-1 rounded-full font-bold uppercase transition-all">Paid (R300)</button>
                                <button onclick="sendWA('${p}')" class="bg-blue-500 text-[9px] px-3 py-1 rounded-full font-bold uppercase flex items-center gap-1">💬 Note</button>
                            </div>
                        </div>
                        <textarea id="note-${p}" class="w-full bg-white/5 p-2 rounded-lg text-[10px] text-gray-300 border border-white/5 outline-none" placeholder="Add progress note for ${p}..."></textarea>
                    </div>
                `;
            }).join('');
            updateIncome();
        }

        function togglePaid(player) {
            ledger[player] = !ledger[player];
            renderTrainerLab();
        }

        function updateIncome() {
            const total = Object.values(ledger).filter(v => v).length * 300;
            document.getElementById('totalIncome').textContent = 'R' + total;
        }

        function resetLedger() { ledger = {}; renderTrainerLab(); }

        function sendWA(player) {
            const note = document.getElementById('note-' + player).value;
            const msg = `🎾 *PadelPilot Pro Progress Report*%0AHi ${player}, here is your coach feedback:%0A%0A"${note}"%0A%0A_See you at the courts!_`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        // MATCH ENGINE (from previous version)
        document.getElementById('generateBtn').onclick = () => {
            const raw = document.getElementById('playersInput').value.split('\n').filter(p => p.trim());
            if (raw.length < 4) return alert("Add 4+ players!");
            players = raw; matches = []; startRound();
        };

        function startRound() {
            const courts = parseInt(document.getElementById('courtsInput').value) || 1;
            const shuffled = [...players].sort(() => 0.5 - Math.random());
            const newMatches = [];
            for (let i = 0; i < courts * 4 && i + 3 < shuffled.length; i += 4) {
                newMatches.push({ id: Date.now() + i, court: (i/4) + 1, p: [shuffled[i], shuffled[i+1], shuffled[i+2], shuffled[i+3]], sA: '', sB: '' });
            }
            matches = [...matches, ...newMatches];
            renderMatches(); updateBoard();
        }

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = matches.slice(- (parseInt(document.getElementById('courtsInput').value) || 1)).map(m => `
                <div class="glass-panel p-4 rounded-2xl flex justify-between items-center shadow-lg">
                    <div class="text-[10px] font-bold w-1/3 text-yellow-400 uppercase leading-tight">C${m.court}<br>${m.p[0]} & ${m.p[1]}</div>
                    <div class="flex gap-2">
                        <input type="number" oninput="upd(${m.id},'A',this.value)" class="w-10 bg-black rounded p-1 text-center font-bold text-white border border-white/10 outline-none">
                        <input type="number" oninput="upd(${m.id},'B',this.value)" class="w-10 bg-black rounded p-1 text-center font-bold text-white border border-white/10 outline-none">
                    </div>
                    <div class="text-[10px] font-bold w-1/3 text-right text-blue-400 uppercase leading-tight">C${m.court}<br>${m.p[2]} & ${m.p[3]}</div>
                </div>
            `).join('');
        }

        function upd(id, team, val) {
            const m = matches.find(x => x.id === id);
            if (team === 'A') m.sA = val; else m.sB = val;
            updateBoard();
        }

        function updateBoard() {
            let l = {}; players.forEach(p => l[p] = { pts: 0, diff: 0 });
            const mode = document.getElementById('modeSelect').value;
            matches.forEach(m => {
                const a = parseInt(m.sA) || 0; const b = parseInt(m.sB) || 0;
                if (m.sA === '' || m.sB === '') return;
                m.p.slice(0,2).forEach(p => l[p].diff += (a - b));
                m.p.slice(2,4).forEach(p => l[p].diff += (b - a));
                if (mode === 'classic') {
                    if (a > b) m.p.slice(0,2).forEach(p => l[p].pts += 3);
                    else if (b > a) m.p.slice(2,4).forEach(p => l[p].pts += 3);
                    else m.p.forEach(p => l[p].pts += 1);
                } else {
                    m.p.slice(0,2).forEach(p => l[p].pts += a);
                    m.p.slice(2,4).forEach(p => l[p].pts += b);
                }
            });
            const sorted = Object.entries(l).sort((a,b) => b[1].pts - a[1].pts || b[1].diff - a[1].diff);
            document.getElementById('leaderboardBody').innerHTML = sorted.map(([n, d], i) => `
                <tr class="border-b border-white/5"><td class="p-3 text-gray-500 font-bold">#${i+1}</td><td class="p-3 font-bold text-xs uppercase">${n}</td><td class="p-3 text-yellow-400 font-black">${d.pts}</td><td class="p-3 text-[10px] font-bold ${d.diff >= 0 ? 'text-green-400' : 'text-red-400'}">${d.diff > 0 ? '+' : ''}${d.diff}</td></tr>
            `).join('');
            document.getElementById('leaderboardSection').classList.remove('hidden');
        }

        function downloadResults() {
            html2canvas(document.getElementById('leaderboardSection'), { backgroundColor: '#111827', scale: 2 }).then(canvas => {
                const link = document.createElement('a'); link.download = 'results.png'; link.href = canvas.toDataURL(); link.click();
            });
        }
    </script>
</body>
</html>
