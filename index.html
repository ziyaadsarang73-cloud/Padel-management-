<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding-bottom: 100px;
    color: #111827;
}

.tab-bar {
    display: flex;
    justify-content: center;
    background: linear-gradient(-45deg,#1e40af,#3b82f6,#fbbf24,#2563eb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG { 
    0% { background-position: 0% 50%; } 
    50% { background-position: 100% 50%; } 
    100% { background-position: 0% 50%; } 
}

.tab-bar a {
    flex: 1;
    text-align: center;
    padding: 1rem;
    font-weight: 700;
    color: white;
    text-decoration: none;
    text-transform: uppercase;
}

.tab-bar a.active {
    background-color: rgba(255,255,255,0.2);
    border-radius: 0.5rem;
}

.banner-padelpilot {
    background-color: #1e40af;
    color: #fbbf24;
    text-align: center;
    padding: 1rem;
    font-size: 2rem;
    font-weight: 700;
}

.banner-arena {
    background: linear-gradient(-45deg,#3b82f6,#2563eb,#1e40af,#fbbf24);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: white;
    text-align: center;
    padding: 1.5rem;
    font-size: 1.5rem;
    font-weight: 700;
}

.input-group input, .input-group select {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.25rem;
    margin-bottom: 0.5rem;
    border-radius: 0.5rem;
    border: 1px solid #d1d5db;
    outline: none;
    font-weight: 700;
}

.button-primary {
    background: linear-gradient(to right, #fbbf24, #2563eb);
    color: white;
    font-weight: 700;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
}

.button-primary:hover {
    transform: scale(1.05);
}

.match-card {
    display: flex;
    justify-content: space-between;
    background: #f3f4f6;
    border-radius: 1rem;
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    font-weight: 700;
    font-size: 1.1rem;
}

.team {
    flex: 1;
    text-align: center;
    padding: 0.5rem;
    border-radius: 0.75rem;
}

.team-left {
    background-color: #e0f2fe;
    color: #1e40af;
}

.team-right {
    background-color: #fde68a;
    color: #b45309;
}

.resting {
    background-color: #fef3c7;
    color: #b45309;
    padding: 0.5rem;
    border-radius: 0.5rem;
    margin-bottom: 1rem;
    text-align: center;
}

</style>
</head>
<body>

<!-- Top Tab Bar -->
<div class="tab-bar">
    <a href="arena.html" class="active">Arena</a>
    <a href="rules.html">Rules</a>
    <a href="leaderboard.html">Leaderboard</a>
</div>

<!-- PadelPilot Banner -->
<div class="banner-padelpilot">PadelPilot</div>

<!-- Arena Banner -->
<div class="banner-arena">THE ARENA</div>

<div class="max-w-4xl mx-auto p-4">

    <!-- Tournament Info -->
    <div class="section">
        <div class="input-group">
            <label for="tournamentInput">Tournament Name</label>
            <input id="tournamentInput" type="text" placeholder="Enter tournament name">
        </div>
        <div class="input-group grid grid-cols-2 gap-4">
            <div>
                <label for="locInput">Location</label>
                <input id="locInput" type="text" placeholder="Enter location">
            </div>
            <div>
                <label for="timeInput">Start Time</label>
                <input id="timeInput" type="text" placeholder="Enter time">
            </div>
        </div>
        <button id="connectTournamentBtn" class="button-primary w-full mb-4">Start / Connect Tournament</button>
    </div>

    <!-- Players Input -->
    <div class="section">
        <div class="input-group">
            <label for="playersInput">Enter Players or Teams (one per line)</label>
            <textarea id="playersInput" class="w-full p-2 rounded-lg border border-gray-300 h-40" placeholder="Player1&#10;Player2&#10;Player3"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label for="courtsInput">Number of Courts</label>
                <input id="courtsInput" type="number" min="1" value="1">
            </div>
            <div>
                <label for="modeSelect">Mode</label>
                <select id="modeSelect">
                    <option value="classic">Classic</option>
                    <option value="americano">Americano</option>
                </select>
            </div>
        </div>
        <button id="generateBtn" class="button-primary w-full mb-4">Generate Round</button>
    </div>

    <!-- Matches Section -->
    <div id="matchesSection">
        <div id="matchesContainer"></div>
        <div id="restingContainer" class="resting"></div>
        <button id="nextBtn" class="button-primary w-full mb-4">Next Round</button>
        <button id="copyLinkBtn" class="button-primary w-full">Copy Match Link</button>
    </div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
    authDomain: "padelpilot-4531f.firebaseapp.com",
    databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
    projectId: "padelpilot-4531f",
    storageBucket: "padelpilot-4531f.appspot.com",
    messagingSenderId: "866905934997",
    appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let players = [], matches = [], currentRound = 1;
let activeTournament = null;

function saveTournamentToFirebase() {
    if (!activeTournament) return;
    const list = document.getElementById('playersInput').value;
    const loc = document.getElementById('locInput').value;
    const time = document.getElementById('timeInput').value;
    db.ref('tournaments/' + activeTournament).set({
        players: list,
        location: loc,
        time: time,
        timestamp: Date.now()
    });
}

document.getElementById('connectTournamentBtn').onclick = () => {
    const name = document.getElementById('tournamentInput').value.trim();
    if (!name) return alert("Enter a tournament name!");
    activeTournament = name.replace(/\s+/g, '-').toLowerCase();
    // Load existing tournament if within 48 hours
    db.ref('tournaments/' + activeTournament).once('value', snapshot => {
        const data = snapshot.val();
        const now = Date.now();
        if (data && now - data.timestamp < 48*3600*1000) {
            if (data.players) document.getElementById('playersInput').value = data.players;
            if (data.location) document.getElementById('locInput').value = data.location;
            if (data.time) document.getElementById('timeInput').value = data.time;
            players = data.players.split('\n').filter(p=>p.trim());
        } else {
            players = [];
        }
    });
};

document.getElementById('generateBtn').onclick = () => {
    const raw = document.getElementById('playersInput').value.split('\n').filter(p=>p.trim());
    if (raw.length < 4) return alert("Add at least 4 players!");
    players = raw;
    matches = []; currentRound = 1;
    startRound();
    saveTournamentToFirebase();
};

document.getElementById('nextBtn').onclick = () => {
    currentRound++;
    startRound();
    saveTournamentToFirebase();
};

document.getElementById('copyLinkBtn').onclick = () => {
    if (!activeTournament) return alert("Start a tournament first!");
    const url = window.location.href.split('?')[0] + "?tournament=" + activeTournament;
    navigator.clipboard.writeText(url).then(()=>alert("Match link copied!"));
};

function startRound() {
    const courts = parseInt(document.getElementById('courtsInput').value) || 1;
    const shuffled = [...players].sort(()=>0.5-Math.random());
    const newMatches = [];
    for(let i=0;i<Math.min(courts*4, shuffled.length);i+=4){
        newMatches.push({court:(i/4)+1,p:[shuffled[i],shuffled[i+1],shuffled[i+2],shuffled[i+3]]});
    }
    const resting = shuffled.slice(newMatches.length*4);
    document.getElementById('restingContainer').textContent = resting.length ? "Resting: "+resting.join(', ') : "Full court engagement!";
    matches = newMatches;
    renderMatches();
}

function renderMatches() {
    const container = document.getElementById('matchesContainer');
    container.innerHTML = '';
    matches.forEach(m=>{
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerHTML = `
            <div class="team team-left">${m.p[0]} & ${m.p[1]}</div>
            <div class="team team-right">${m.p[2]} & ${m.p[3]}</div>
        `;
        container.appendChild(div);
    });
}
</script>

</body>
</html>
