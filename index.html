<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}
/* Top Tabs */
.top-tabs{background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);padding:14px;display:flex;justify-content:center;gap:40px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{background:#0f172a;color:white;text-align:center;padding:18px;font-size:22px;font-weight:900;letter-spacing:.2em;}
.arena-banner{background:linear-gradient(90deg,#2563eb,#facc15);color:#0f172a;text-align:center;padding:26px;font-size:32px;font-weight:900;letter-spacing:.15em;}

/* Tournament Info */
.tournament-info-wrapper{width:100%;margin-bottom:18px;}
.tournament-field{flex:1;display:flex;flex-direction:column;margin-bottom:8px;}
.tournament-row{display:flex;gap:12px;width:100%;}
.field-label{font-size:12px;font-weight:700;margin-bottom:2px;color:#0f172a;}
.field-input{padding:8px 10px;border-radius:10px;border:1px solid #d1d5db;font-size:14px;}
.time-field{max-width:160px;}

/* Share Button */
.share-btn{margin-top:12px;width:100%;white-space:nowrap;text-align:center;background:#3b82f6;color:white;padding:10px;font-weight:700;border-radius:10px;cursor:pointer;transition:.2s;}
.share-btn:disabled{opacity:.6;cursor:not-allowed;}

/* Matches */
.match-card{background:linear-gradient(135deg,#f1f5f9,#e0f2fe);border-radius:24px;padding:28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.08);}
.team-block{width:38%;font-size:24px;font-weight:800;color:#0f172a}
.score-row{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.score-row input{width:80px;height:64px;font-size:28px;text-align:center;border-radius:14px;border:2px solid #e5e7eb;background:white}

/* Resting Players */
.resting-players{margin-top:16px;padding:12px;background:#fef3c7;color:#b45309;border-radius:12px;font-weight:700;}

/* Loading & Feedback */
.feedback-msg{margin-top:6px;font-size:12px;color:#2563eb;font-weight:700;}
</style>
</head>

<body>

<div class="top-tabs">
<a href="index.html" class="active">Arena</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="arena-banner">ARENA</div>

<div class="max-w-5xl mx-auto p-6 space-y-6">

<!-- TOURNAMENT INFO -->
<div class="tournament-info-wrapper">
  <div class="tournament-field">
    <label class="field-label">Tournament Name</label>
    <input id="tournamentName" class="field-input" type="text" placeholder="Enter tournament name" />
  </div>

  <div class="tournament-row">
    <div class="tournament-field">
      <label class="field-label">Location</label>
      <input id="tournamentLocation" class="field-input" type="text" placeholder="Enter location" />
    </div>
    <div class="tournament-field time-field">
      <label class="field-label">Time</label>
      <input id="tournamentTime" class="field-input" type="time" />
    </div>
  </div>

  <button id="shareTournamentBtn" class="share-btn" onclick="copyMatchLink()">
    Share Tournament Link
  </button>
  <div id="feedbackMsg" class="feedback-msg"></div>
</div>

<!-- SETUP -->
<div class="bg-gray-100 p-6 rounded-2xl shadow space-y-4">
  <select id="tournamentType" class="w-full p-3 rounded border">
    <option value="classic">Classic 3 Point</option>
    <option value="teamclassic">Team Classic 3 Point</option>
    <option value="americano">Classic Americano</option>
    <option value="mixed">Mixed Americano</option>
    <option value="teamamericano">Team Americano</option>
  </select>

  <textarea id="playersInput" class="w-full p-3 border rounded h-36" placeholder="Enter players or team names"></textarea>

  <div class="flex gap-4">
    <input id="courtsInput" type="number" min="1" value="1" class="w-24 p-2 border rounded">
    <button id="syncBtn" onclick="syncTournament()" class="bg-green-600 text-white px-6 rounded">Sync</button>
    <button onclick="generateMatches()" class="bg-yellow-400 px-6 rounded font-bold">Generate Round</button>
  </div>
</div>

<!-- MATCHES -->
<div id="matchesContainer" class="space-y-6"></div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let meetId = new URLSearchParams(window.location.search).get('meet') || null;
let currentMatches = [];
let currentRound = 0;
let restingPlayers = [];

// AUTO LOAD TOURNAMENT IF ID IN URL
if(meetId){
  document.getElementById('tournamentName').value = meetId.replace(/-/g,' ');
  listenTournament();
}

// LISTENER
function listenTournament(){
  if(!meetId) return;
  document.getElementById('feedbackMsg').textContent = "Loading tournament...";
  db.ref('arena/'+meetId).on('value',snap=>{
    const data=snap.val();
    if(!data){
      document.getElementById('feedbackMsg').textContent = "";
      return;
    }

    tournamentLocation.value=data.location||'';
    tournamentTime.value=data.time||'';
    playersInput.value=data.players||'';
    tournamentType.value=data.type||'classic';
    currentMatches = data.matches || [];
    currentRound = data.round || 1;
    restingPlayers = data.resting || [];

    renderMatches(restingPlayers);
    document.getElementById('feedbackMsg').textContent = "Tournament loaded!";
    setTimeout(()=>document.getElementById('feedbackMsg').textContent='',2000);
  });
}

// SYNC TO FIREBASE
function syncTournament(){
  if(!tournamentName.value) return alert("Enter tournament name");
  meetId=tournamentName.value.replace(/\s+/g,'-').toLowerCase();
  document.getElementById('syncBtn').disabled = true;
  document.getElementById('feedbackMsg').textContent = "Syncing...";

  db.ref('arena/'+meetId).update({
    name:tournamentName.value,
    location:tournamentLocation.value,
    time:tournamentTime.value,
    players:playersInput.value,
    type:tournamentType.value,
    matches: currentMatches,
    round: currentRound,
    resting: restingPlayers,
    timestamp: Date.now()
  }).then(()=>{
    window.history.replaceState({}, '', '?meet='+meetId);
    document.getElementById('syncBtn').disabled = false;
    document.getElementById('feedbackMsg').textContent = "Tournament synced!";
    setTimeout(()=>document.getElementById('feedbackMsg').textContent='',2000);
  });
}

// SHARE TO CLIPBOARD
function copyMatchLink(){
  if(!meetId) return alert("Sync tournament first");
  const url=location.origin+location.pathname+"?meet="+meetId;
  navigator.clipboard.writeText(url);
  alert("Tournament link copied!");
}

// GENERATE MATCHES
function generateMatches(){
  if(!meetId) return alert("Sync tournament first");
  let raw=playersInput.value.split('\n').filter(p=>p.trim());
  if(raw.length<4) return alert("Need at least 4 entries");

  let shuffled=[...raw].sort(()=>0.5-Math.random());
  let courts=parseInt(courtsInput.value)||1;

  currentMatches=[];
  restingPlayers=[];

  let maxCourts=Math.floor(shuffled.length/4);
  let actualCourts=Math.min(courts,maxCourts);

  for(let i=0;i<actualCourts*4;i+=4){
    currentMatches.push({
      teamA:[shuffled[i],shuffled[i+1]],
      teamB:[shuffled[i+2],shuffled[i+3]],
      scoreA:0,
      scoreB:0
    });
  }

  restingPlayers=shuffled.slice(actualCourts*4);
  currentRound = (currentRound||0)+1;

  db.ref('arena/'+meetId).update({
    matches: currentMatches,
    resting: restingPlayers,
    round: currentRound
  });

  renderMatches(restingPlayers);
}

// RENDER MATCHES
function renderMatches(resting=[]){
  const container=document.getElementById('matchesContainer');
  container.innerHTML='';

  const roundDiv=document.createElement('div');
  roundDiv.className='text-xl font-bold mb-4';
  roundDiv.textContent=`Round ${currentRound}`;
  container.appendChild(roundDiv);

  currentMatches.forEach((m,i)=>{
    let card=document.createElement('div');
    card.className='match-card';
    card.innerHTML=`
      <div class="team-block">${m.teamA[0]}<br>${m.teamA[1]||''}</div>
      <div class="score-row">
        <input type="number" value="${m.scoreA}" oninput="updateScore(${i},'A',this.value)">
        <span>vs</span>
        <input type="number" value="${m.scoreB}" oninput="updateScore(${i},'B',this.value)">
      </div>
      <div class="team-block text-right">${m.teamB[0]}<br>${m.teamB[1]||''}</div>
    `;
    container.appendChild(card);
  });

  if(resting.length>0){
    const restDiv=document.createElement('div');
    restDiv.className='resting-players';
    restDiv.textContent='Resting Players: '+resting.join(', ');
    container.appendChild(restDiv);
  }
}

// UPDATE SCORE
function updateScore(index,side,val){
  currentMatches[index]['score'+side]=parseInt(val)||0;
  db.ref('arena/'+meetId+'/matches').set(currentMatches);
}
</script>

</body>
</html>
