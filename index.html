<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PadelPilot Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: white; margin: 0; padding: 0; }
        
        /* THE NEON APP AESTHETIC */
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-border-volt { border: 2px solid #e1ff00; box-shadow: 0 0 15px rgba(225, 255, 0, 0.2); }
        .tab-view { display: none; }
        .tab-active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TAB BAR */
        .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; z-index: 100; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; transition: all 0.2s; opacity: 0.5; }
        .nav-btn.active { opacity: 1; transform: translateY(-5px); }

        /* BANNERS */
        #mainBanner { height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: background 0.5s ease; }
    </style>
</head>
<body>

    <div id="mainBanner" class="bg-slate-900 border-b border-white/10">
        <h1 id="bannerTitle" class="text-4xl font-black italic tracking-tighter italic">THE ARENA</h1>
        <p id="bannerSubtitle" class="text-[10px] uppercase tracking-widest font-bold opacity-70">Live Session Control</p>
    </div>

    <div class="p-4 pb-32 max-w-2xl mx-auto">
        
        <div id="tab-arena" class="tab-view tab-active space-y-6">
            
            <div class="glass-card p-5 rounded-[2rem] neon-border-volt">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[10px] font-bold text-yellow-400 uppercase">📍 Location</p>
                        <h2 class="text-lg font-bold">Constantia Padel Hub</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-yellow-400 uppercase">⏰ Time</p>
                        <h2 class="text-lg font-bold">09:00 AM</h2>
                    </div>
                </div>
                <button onclick="handleCheckIn()" id="checkInBtn" class="w-full bg-green-500 text-white font-black py-3 rounded-xl uppercase italic shadow-lg active:scale-95 transition-all">
                    I'm at the court! 🎾
                </button>
            </div>

            <div class="glass-card p-4 rounded-2xl">
                <input type="text" id="playerName" placeholder="Enter Player Name..." class="w-full bg-slate-800 p-3 rounded-xl border border-white/10 mb-2 focus:outline-none focus:border-yellow-400">
                <button onclick="addPlayer()" class="w-full bg-yellow-400 text-black font-black py-2 rounded-xl uppercase text-sm">Add to Session</button>
            </div>

            <div id="leaderboard" class="space-y-2">
                </div>

            <button onclick="generateRounds()" class="w-full bg-blue-600 font-black py-4 rounded-2xl uppercase italic shadow-blue-900/50 shadow-lg">Generate Next Round 🚀</button>
            
            <div id="matchDisplay" class="space-y-3">
                </div>
        </div>

        <div id="tab-lab" class="tab-view text-center pt-20">
            <span class="text-5xl">🔒</span>
            <h2 class="text-2xl font-bold mt-4">Trainer Lab</h2>
            <p class="text-sm opacity-60 mb-6">Revenue tracking & student notes are private.</p>
            <button onclick="loginPrompt()" class="bg-cyan-500 px-10 py-3 rounded-full font-black italic">LOGIN</button>
        </div>

        <div id="tab-tourney" class="tab-view text-center pt-20">
            <span class="text-5xl">🏆</span>
            <h2 class="text-2xl font-bold mt-4">Pro Tournaments</h2>
            <p class="text-sm opacity-60 mb-6">Bracket management coming soon.</p>
        </div>

        <div id="tab-racky" class="tab-view space-y-4">
            <div class="glass-card p-6 rounded-3xl text-center">
                <img src="racky-avatar.png" class="w-32 mx-auto animate-bounce">
                <h2 class="text-2xl font-bold">Ask Racky</h2>
                <p class="text-sm opacity-70">Rules, Tips, and Badges!</p>
            </div>
            <input type="text" placeholder="Search rules (e.g. 'net', 'fence')..." class="w-full bg-slate-800 p-4 rounded-2xl border border-white/10">
        </div>

    </div>

    <div class="nav-dock glass-card p-2 rounded-[2.5rem] flex justify-around items-center">
        <button onclick="setActiveTab('arena')" id="btn-arena" class="nav-btn active">
            <span class="text-2xl">🎾</span>
            <span class="text-[9px] font-bold uppercase mt-1">Arena</span>
        </button>
        <button onclick="setActiveTab('lab')" id="btn-lab" class="nav-btn">
            <span class="text-2xl">📊</span>
            <span class="text-[9px] font-bold uppercase mt-1">Lab</span>
        </button>
        <button onclick="setActiveTab('tourney')" id="btn-tourney" class="nav-btn">
            <span class="text-2xl">🏆</span>
            <span class="text-[9px] font-bold uppercase mt-1">Tourney</span>
        </button>
        <button onclick="setActiveTab('racky')" id="btn-racky" class="nav-btn">
            <span class="text-2xl">🤖</span>
            <span class="text-[9px] font-bold uppercase mt-1">Racky</span>
        </button>
    </div>

    <script>
        // NAVIGATION LOGIC
        function setActiveTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('tab-active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab
            document.getElementById('tab-' + tabId).classList.add('tab-active');
            document.getElementById('btn-' + tabId).classList.add('active');
            
            // Update Banner
            const title = document.getElementById('bannerTitle');
            const banners = {
                'arena': { title: 'THE ARENA', color: '#e1ff00' },
                'lab': { title: 'TRAINER LAB', color: '#22d3ee' },
                'tourney': { title: 'PRO TOURNAMENT', color: '#a855f7' },
                'racky': { title: 'ASK RACKY', color: '#4ade80' }
            };
            title.innerText = banners[tabId].title;
            title.style.color = banners[tabId].color;
        }

        // CHECK-IN LOGIC
        function handleCheckIn() {
            const btn = document.getElementById('checkInBtn');
            btn.innerText = "CHECKED IN! ✅";
            btn.classList.replace('bg-green-500', 'bg-slate-700');
            // Logic to send Check-in to Firebase goes here
        }

        // --- ALL YOUR ORIGINAL PLAYER & ROUND LOGIC GOES BELOW ---
        // (addPlayer, generateRounds, updateScore, etc.)
    </script>
</body>
</html>
