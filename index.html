<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadelPilot Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Background & Aesthetics */
        body {
            background: linear-gradient(rgba(17, 24, 39, 0.8), rgba(17, 24, 39, 0.9)), 
                        url('https://images.unsplash.com/photo-1626245902045-8798e1363533?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: sans-serif;
        }

        .vibrant-banner {
            background: linear-gradient(-45deg, #1e40af, #3b82f6, #fbbf24, #2563eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Racky Animations */
        .racky-bounce { animation: bounce 3s infinite ease-in-out; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto vibrant-banner p-1 rounded-3xl shadow-2xl mb-8">
        <div class="bg-gray-900/60 backdrop-blur-md p-6 rounded-[1.4rem] flex items-center gap-6">
            <div class="racky-bounce">
                <img src="https://i.ibb.co/VWB8Yp9/racky-mascot.jpg" alt="Racky" class="w-24 h-24 rounded-full border-4 border-yellow-400 shadow-xl bg-yellow-400">
            </div>
            <div class="flex-1">
                <h1 class="text-4xl font-black italic tracking-tighter">PADEL<span class="text-yellow-400">PILOT</span></h1>
                <div class="bg-black/30 px-3 py-1 rounded-lg mt-2 inline-block">
                    <p id="mascotText" class="text-yellow-200 font-bold italic">"Ready for a smash?"</p>
                </div>
            </div>
            <div id="timerContainer" class="hidden text-right">
                <div id="timeDisplay" class="text-3xl font-mono font-bold text-yellow-400">20:00</div>
                <button id="timerBtn" class="text-[10px] bg-white/10 px-2 py-1 rounded uppercase">Start</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-gray-900/80 p-6 rounded-3xl border border-gray-700">
            <h2 class="text-xs font-bold uppercase text-blue-400 mb-4 tracking-widest">Setup</h2>
            <textarea id="playersInput" class="w-full bg-black/50 border border-gray-700 p-3 rounded-xl h-40 outline-none focus:border-yellow-400" placeholder="Enter players..."></textarea>
            
            <div class="mt-4 space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span>Enable Timer?</span>
                    <input type="checkbox" id="timerToggle" class="w-5 h-5 accent-yellow-400">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <span>Golden Point?</span>
                    <input type="checkbox" id="gpToggle" class="w-5 h-5 accent-yellow-400">
                </div>
                <select id="modeSelect" class="w-full bg-black/50 p-2 rounded-lg border border-gray-700 text-sm">
                    <option value="classic">Classic (3pts Win)</option>
                    <option value="americano">Americano (Total Games)</option>
                </select>
                <button id="generateBtn" class="w-full bg-yellow-400 text-blue-900 font-black py-3 rounded-xl uppercase hover:scale-105 transition">Generate Round</button>
                <button id="createSession" class="w-full text-blue-400 text-xs font-bold">🌐 Create Live Session</button>
                <div id="sessionInfo" class="text-center text-xs mt-2"></div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div id="matchesSection" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="roundDisplay" class="text-xl font-bold italic">ROUND 1</h3>
                    <button id="nextBtn" class="bg-green-500 px-4 py-1 rounded-full text-sm font-bold">NEXT ROUND</button>
                </div>
                <div id="matchesContainer" class="grid grid-cols-1 gap-4"></div>
            </div>

            <div id="leaderboardSection" class="hidden bg-gray-900/80 rounded-3xl overflow-hidden border border-gray-700">
                <div class="p-4 bg-gray-800 flex justify-between items-center">
                    <span class="font-bold">🏆 STANDINGS</span>
                    <button onclick="downloadResults()" class="text-xs bg-white/10 px-3 py-1 rounded-full">📸 Save Image</button>
                </div>
                <table class="w-full text-sm text-left">
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
            authDomain: "padelpilot-4531f.firebaseapp.com",
            databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
            projectId: "padelpilot-4531f",
            storageBucket: "padelpilot-4531f.appspot.com",
            messagingSenderId: "866905934997",
            appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- GLOBAL STATE ---
        let players = []; let matches = []; let currentRound = 1; let leaderboard = {};

        // --- CORE LOGIC ---
        function rackySay(msg) { document.getElementById('mascotText').textContent = `"${msg}"`; }

        document.getElementById('generateBtn').onclick = () => {
            const raw = document.getElementById('playersInput').value.split('\n').filter(p => p.trim());
            if (raw.length < 4) return alert("Need 4 players!");
            players = raw;
            matches = []; currentRound = 1;
            startRound();
        };

        function startRound() {
            const shuffled = [...players].sort(() => 0.5 - Math.random());
            const newMatches = [];
            for (let i = 0; i + 3 < shuffled.length; i += 4) {
                newMatches.push({
                    id: Date.now() + i,
                    p: [shuffled[i], shuffled[i+1], shuffled[i+2], shuffled[i+3]],
                    sA: '', sB: ''
                });
            }
            matches = [...matches, ...newMatches];
            render();
            rackySay("Matches are ready! Hit the court.");
        }

        function render() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            const roundMatches = matches.slice(-1); // Simplification for 1 court example
            
            roundMatches.forEach(m => {
                const div = document.createElement('div');
                div.className = 'bg-gray-800 p-4 rounded-2xl flex justify-between items-center';
                div.innerHTML = `
                    <div class="text-xs font-bold">${m.p[0]} & ${m.p[1]}</div>
                    <div class="flex gap-2">
                        <input type="number" oninput="upd(${m.id},'A',this.value)" class="w-12 bg-black rounded p-1 text-center text-yellow-400">
                        <input type="number" oninput="upd(${m.id},'B',this.value)" class="w-12 bg-black rounded p-1 text-center text-blue-400">
                    </div>
                    <div class="text-xs font-bold text-right">${m.p[2]} & ${m.p[3]}</div>
                `;
                container.appendChild(div);
            });
            document.getElementById('matchesSection').classList.remove('hidden');
            updateBoard();
        }

        function upd(id, team, val) {
            const m = matches.find(x => x.id === id);
            if (team === 'A') m.sA = val; else m.sB = val;
            updateBoard();
        }

        function updateBoard() {
            leaderboard = {};
            players.forEach(p => leaderboard[p] = { pts: 0, diff: 0 });
            const mode = document.getElementById('modeSelect').value;

            matches.forEach(m => {
                const a = parseInt(m.sA) || 0; const b = parseInt(m.sB) || 0;
                if (!m.sA || !m.sB) return;

                m.p.slice(0,2).forEach(p => leaderboard[p].diff += (a - b));
                m.p.slice(2,4).forEach(p => leaderboard[p].diff += (b - a));

                if (mode === 'classic') {
                    if (a > b) m.p.slice(0,2).forEach(p => leaderboard[p].pts += 3);
                    else if (b > a) m.p.slice(2,4).forEach(p => leaderboard[p].pts += 3);
                } else {
                    m.p.slice(0,2).forEach(p => leaderboard[p].pts += a);
                    m.p.slice(2,4).forEach(p => leaderboard[p].pts += b);
                }
            });

            const sorted = Object.entries(leaderboard).sort((a,b) => b[1].pts - a[1].pts || b[1].diff - a[1].diff);
            const body = document.getElementById('leaderboardBody');
            body.innerHTML = sorted.map(([n, d], i) => `
                <tr class="border-b border-gray-800">
                    <td class="p-3 text-gray-500">#${i+1}</td>
                    <td class="p-3 font-bold">${n}</td>
                    <td class="p-3 text-yellow-400 font-black">${d.pts}</td>
                    <td class="p-3 text-xs text-gray-400">Diff: ${d.diff}</td>
                </tr>
            `).join('');
            document.getElementById('leaderboardSection').classList.remove('hidden');
        }

        // --- EXPORT IMAGE ---
        function downloadResults() {
            html2canvas(document.getElementById('leaderboardSection'), { backgroundColor: '#111827' }).then(c => {
                const a = document.createElement('a'); a.download = 'results.png'; a.href = c.toDataURL(); a.click();
            });
        }

        // --- TIMER TOGGLE ---
        document.getElementById('timerToggle').onchange = (e) => {
            document.getElementById('timerContainer').classList.toggle('hidden', !e.target.checked);
        };
    </script>
</body>
</html>
