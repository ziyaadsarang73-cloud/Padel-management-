<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Match Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 p-4">
  <div class="max-w-lg mx-auto space-y-4">

    <h1 class="text-xl font-bold text-center">Padel Match Generator</h1>

    <!-- Player Input -->
    <textarea id="playersInput"
      class="w-full h-40 p-2 rounded bg-gray-800 text-gray-200"
      placeholder="Enter one player per line"></textarea>

    <!-- Courts -->
    <input id="courtsInput" type="number" min="1"
      class="w-full p-2 rounded bg-gray-800 text-gray-200"
      placeholder="Number of courts" />

    <!-- Mode -->
    <select id="modeSelect"
      class="w-full p-2 rounded bg-gray-800 text-gray-200">
      <option value="classic">Classic</option>
      <option value="americano">Americano</option>
    </select>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button id="generateBtn"
        class="flex-1 bg-green-400 text-gray-900 font-semibold py-2 rounded">
        Generate Matches
      </button>

      <button id="resetBtn"
        class="flex-1 border border-red-500 text-red-500 font-semibold py-2 rounded">
        Reset
      </button>
    </div>

    <button id="nextRoundBtn"
      class="w-full bg-gray-700 text-gray-200 font-semibold py-2 rounded hidden">
      Next Round
    </button>

    <!-- Round Display -->
    <div id="roundDisplay"
      class="text-center text-sm text-gray-400 hidden">
      Round 1
    </div>

    <!-- Matches -->
    <section id="matchesSection" class="hidden">
      <h2 class="text-lg font-semibold mb-2">Matches</h2>
      <div id="matchesContainer" class="space-y-3"></div>
      <div id="restingContainer" class="mt-3 text-sm text-gray-400"></div>
    </section>

    <!-- Leaderboard -->
    <section id="leaderboardSection" class="hidden">
      <h2 class="text-lg font-semibold mb-2">Leaderboard</h2>
      <table class="w-full text-sm">
        <thead class="bg-gray-800">
          <tr>
            <th class="px-2 py-1 text-left">#</th>
            <th class="px-2 py-1 text-left">Player</th>
            <th class="px-2 py-1 text-right">Points</th>
            <th class="px-2 py-1 text-right">Matches</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </section>

  </div>

  <script>
    // We will fill this in step-by-step
  </script>
</body>
</html>
