<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

    body {
        margin: 0; font-family: 'Space Grotesk', sans-serif;
        background: #0f172a; color: white;
    }

    .top-banner {
        background: linear-gradient(-45deg, #1e40af, #3b82f6, #fbbf24, #2563eb);
        background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        text-align: center; padding: 1rem 0;
        font-size: 2rem; font-weight: 700;
    }
    @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .top-tabs {
        display: flex; justify-content: center; gap: 2rem; background: #1e293b;
        padding: 0.5rem 0; font-weight: 600;
    }
    .top-tab { cursor: pointer; transition: 0.3s; padding: 0.3rem 0.5rem; border-b-2 border-transparent; }
    .top-tab.active { border-bottom: 3px solid #fbbf24; color: #fbbf24; }

    .page-container { padding: 1rem; max-width: 900px; margin: auto; background: white; color: black; border-radius: 1rem; margin-top: 1rem; }

    .arena-banner { background: #2563eb; color: white; text-align: center; padding: 0.5rem 0; margin-bottom: 1rem; font-weight: bold; border-radius: 0.5rem; }

    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .match-card { background: #e5e7eb; padding: 1rem; margin-bottom: 0.8rem; border-radius: 1rem; font-weight: 600; font-size: 1.1rem; display: flex; justify-content: space-between; }

    .rules-section, .player-input-section { margin-bottom: 1rem; }
    .rules-section select, .player-input-section input { width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #ccc; }
</style>
</head>
<body>

<div class="top-banner">PadelPilot</div>

<div class="top-tabs">
    <div class="top-tab active" onclick="switchPage('arena')">Arena</div>
    <div class="top-tab" onclick="switchPage('lab')">Lab</div>
    <div class="top-tab" onclick="switchPage('hub')">Hub</div>
</div>

<div class="page-container">

    <!-- Arena Page -->
    <div id="arena" class="tab-view active">
        <div class="arena-banner">THE ARENA</div>

        <!-- Rules / Mode Section -->
        <div class="rules-section">
            <label for="tournamentType" class="font-bold">Choose Tournament Type:</label>
            <select id="tournamentType">
                <optgroup label="Classic">
                    <option value="classic3">Classic 3 Point - Each player teams with every other player once. Points individually.</option>
                    <option value="teamClassic3">Team Classic 3 Point - Each team plays all others once. Points per team.</option>
                </optgroup>
                <optgroup label="Americano">
                    <option value="classicAmericano">Classic Americano - Each player teams with every other player once. Points individually.</option>
                    <option value="mixedAmericano">Mixed Americano - Players team with opposite sex once. Points individually.</option>
                    <option value="teamAmericano">Team Americano - Teams play all others once. Points per team.</option>
                </optgroup>
            </select>
        </div>

        <!-- Player / Team Input -->
        <div class="player-input-section">
            <label for="playerInput" class="font-bold">Add Players or Teams:</label>
            <input type="text" id="playerInput" placeholder="Enter comma-separated names or team names">
        </div>

        <!-- Match-Up Section -->
        <div id="matchesContainer">
            <!-- Match cards will be generated here -->
        </div>

    </div>

    <!-- Lab Page -->
    <div id="lab" class="tab-view">
        <h2>Trainer Lab</h2>
        <p>Lab functionality will appear here.</p>
    </div>

    <!-- Hub Page -->
    <div id="hub" class="tab-view">
        <h2>Hub</h2>
        <p>Hub functionality will appear here.</p>
    </div>

</div>

<script>
    // Firebase config placeholder (keep existing logic)
    const firebaseConfig = {
        apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
        authDomain: "padelpilot-4531f.firebaseapp.com",
        databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
        projectId: "padelpilot-4531f",
        storageBucket: "padelpilot-4531f.appspot.com",
        messagingSenderId: "866905934997",
        appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function switchPage(pageId) {
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.top-tab[onclick="switchPage('${pageId}')"]`).classList.add('active');
    }
</script>

</body>
</html>
