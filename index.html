<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

body { margin:0; font-family: 'Space Grotesk', sans-serif; background:#0f172a; color:white; }

.top-banner { 
    background: linear-gradient(-45deg, #1e40af, #3b82f6, #fbbf24, #2563eb); 
    background-size: 400% 400%; animation: gradientBG 15s ease infinite; 
    text-align:center; font-size:2rem; font-weight:700; padding:1rem 0; 
}
@keyframes gradientBG { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }

.top-tabs { display:flex; justify-content:center; gap:2rem; background:#1e293b; padding:0.5rem 0; font-weight:600; }
.top-tab { cursor:pointer; transition:0.3s; padding:0.3rem 0.5rem; border-bottom:2px solid transparent; }
.top-tab.active { border-bottom:3px solid #fbbf24; color:#fbbf24; }

.page-container { padding:1rem; max-width:900px; margin:1rem auto; background:white; color:black; border-radius:1rem; }

.arena-banner { background:#2563eb; color:white; text-align:center; padding:0.5rem 0; margin-bottom:1rem; font-weight:bold; border-radius:0.5rem; }

.tab-view { display:none; }
.tab-view.active { display:block; }

.rules-section, .player-input-section { margin-bottom:1rem; }
.rules-section select, .player-input-section textarea { width:100%; padding:0.5rem; border-radius:0.5rem; border:1px solid #ccc; font-size:1rem; }

.match-card { background:#f3f4f6; padding:1rem; margin-bottom:0.8rem; border-radius:1rem; font-weight:700; font-size:1.2rem; display:flex; justify-content:space-between; align-items:center; }
.match-card input[type=number] { width:3rem; padding:0.3rem; border-radius:0.5rem; border:1px solid #ccc; text-align:center; font-weight:bold; }

input.editable-pass-input { background:transparent; border:none; font-weight:700; outline:none; width:100%; padding:0.2rem; }
input.editable-pass-input:focus { background:rgba(0,0,0,0.05); border-radius:4px; }

.button { font-weight:bold; padding:0.5rem 1rem; border-radius:0.8rem; cursor:pointer; }
</style>
</head>
<body>

<div class="top-banner">PadelPilot</div>

<div class="top-tabs">
    <div class="top-tab active" onclick="switchPage('arena')">Arena</div>
    <div class="top-tab" onclick="switchPage('lab')">Lab</div>
    <div class="top-tab" onclick="switchPage('hub')">Hub</div>
</div>

<div class="page-container">

<!-- Arena Page -->
<div id="arena" class="tab-view active">

    <div class="arena-banner">THE ARENA</div>

    <!-- Location & Time & Share -->
    <div class="flex gap-4 mb-4 flex-wrap">
        <div class="flex-1">
            <p class="text-xs font-bold uppercase mb-1">📍 Location</p>
            <input id="locInput" type="text" value="Constantia Hub" class="editable-pass-input text-lg">
        </div>
        <div class="flex-1">
            <p class="text-xs font-bold uppercase mb-1">⏰ Start Time</p>
            <input id="timeInput" type="text" value="09:00 AM" class="editable-pass-input text-lg text-right">
        </div>
        <div class="flex-1 flex items-end">
            <button onclick="copyMatchLink()" class="bg-blue-500 text-white button">🔗 Share Meet</button>
        </div>
    </div>

    <!-- Rules / Mode Section -->
    <div class="rules-section">
        <label class="font-bold">Tournament Type:</label>
        <select id="modeSelect">
            <optgroup label="Classic">
                <option value="classic">Classic 3 Point - Each player teams with every other player once. Points individually.</option>
                <option value="teamClassic">Team Classic 3 Point - Teams play all others once. Points per team.</option>
            </optgroup>
            <optgroup label="Americano">
                <option value="classicAmericano">Classic Americano - Each player teams with every other player once. Points individually.</option>
                <option value="mixedAmericano">Mixed Americano - Players team with opposite sex once. Points individually.</option>
                <option value="teamAmericano">Team Americano - Teams play all others once. Points per team.</option>
            </optgroup>
        </select>
    </div>

    <!-- Player Input -->
    <div class="player-input-section">
        <label class="font-bold">Players / Teams:</label>
        <textarea id="playersInput" class="w-full p-3 rounded-xl border border-gray-300" placeholder="Enter one name per line..."></textarea>
        <button id="savePlayersBtn" class="mt-2 bg-green-500 text-white button w-full">💾 Sync to Cloud</button>
    </div>

    <!-- Courts & Generate -->
    <div class="flex gap-2 mb-4 flex-wrap">
        <input id="courtsInput" type="number" value="1" min="1" class="p-2 rounded-lg border border-gray-300 w-24 text-center">
        <button id="generateBtn" class="bg-yellow-400 text-blue-900 button flex-1">Generate Round</button>
    </div>

    <!-- Matches Section -->
    <div id="matchesSection" class="hidden">
        <h3 class="font-bold mb-2">Matches:</h3>
        <div id="matchesContainer"></div>
        <div id="restingContainer" class="mt-2 text-sm italic text-gray-600"></div>
        <button id="nextBtn" class="mt-2 bg-green-500 text-white button w-full">Next Round</button>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboardSection" class="hidden mt-4 p-4 bg-gray-100 rounded-lg border border-gray-300">
        <h3 class="font-bold mb-2">Leaderboard</h3>
        <table class="w-full text-left text-sm">
            <tbody id="leaderboardBody"></tbody>
        </table>
        <button onclick="downloadResults()" class="mt-2 bg-gray-400 text-black button">Export PNG</button>
    </div>

</div>

<!-- Lab Page -->
<div id="lab" class="tab-view">
    <h2>Trainer Lab</h2>
    <p>Lab functionality coming soon.</p>
</div>

<!-- Hub Page -->
<div id="hub" class="tab-view">
    <h2>Hub</h2>
    <p>Hub functionality coming soon.</p>
</div>

</div>

<script>
// Firebase
const firebaseConfig = {
    apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
    authDomain: "padelpilot-4531f.firebaseapp.com",
    databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com",
    projectId: "padelpilot-4531f",
    storageBucket: "padelpilot-4531f.appspot.com",
    messagingSenderId: "866905934997",
    appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Variables
let players = [], matches = [], currentRound = 1;
let activeMeetId = new URLSearchParams(window.location.search).get('meet');

// Switch tab pages
function switchPage(pageId){
    document.querySelectorAll('.tab-view').forEach(t=>t.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.top-tab[onclick="switchPage('${pageId}')"]`).classList.add('active');
}

// Connect to Firebase meet
function connectToMeet(id){
    if(!id) return;
    activeMeetId = id.replace(/\s+/g,'-').toLowerCase();
    db.ref('meets/'+activeMeetId).on('value', snapshot=>{
        const data = snapshot.val();
        if(data){
            if(data.players) document.getElementById('playersInput').value = data.players;
            if(data.location) document.getElementById('locInput').value = data.location;
            if(data.time) document.getElementById('timeInput').value = data.time;
            players = data.players ? data.players.split('\n').filter(p=>p.trim()) : [];
        }
    });
    document.getElementById('savePlayersBtn').onclick = function(){
        const list = document.getElementById('playersInput').value;
        const loc = document.getElementById('locInput').value;
        const time = document.getElementById('timeInput').value;
        db.ref('meets/'+activeMeetId).update({ players:list, location:loc, time:time })
        .then(()=>alert("Cloud Sync Successful!"));
    };
}

// Copy Match Link
function copyMatchLink(){
    if(!activeMeetId) return alert("Connect to a Meet Name first!");
    const url = window.location.href.split('?')[0] + "?meet=" + activeMeetId;
    navigator.clipboard.writeText(url).then(()=>alert("Link Copied!"));
}

// Initialize if meet in URL
if(activeMeetId){
    document.getElementById('playersInput').value = activeMeetId;
    connectToMeet(activeMeetId);
}

// Generate rounds / matches logic
document.getElementById('generateBtn').onclick = function(){
    const raw = document.getElementById('playersInput').value.split('\n').filter(p=>p.trim());
    if(raw.length < 4) return alert("Add 4+ players!");
    players = raw; matches=[]; currentRound=1; startRound();
};

document.getElementById('nextBtn').onclick = ()=>{ currentRound++; startRound(); };

function startRound(){
    const courts = parseInt(document.getElementById('courtsInput').value)||1;
    const shuffled = [...players].sort(()=>0.5-Math.random());
    const newMatches = [];
    for(let i=0;i<courts*4 && i+3<shuffled.length;i+=4){
        newMatches.push({id:Date.now()+i, court:(i/4)+1, p:[shuffled[i],shuffled[i+1],shuffled[i+2],shuffled[i+3]], sA:'', sB:''});
    }
    const resting = shuffled.slice(newMatches.length*4);
    document.getElementById('restingContainer').textContent = resting.length? `Resting: ${resting.join(', ')}`:'Full court engagement!';
    document.getElementById('matchesSection').classList.remove('hidden');
    matches=[...matches, ...newMatches];
    render(); updateBoard();
}

function render(){
    const container = document.getElementById('matchesContainer');
    container.innerHTML='';
    const count=parseInt(document.getElementById('courtsInput').value)||1;
    matches.slice(-count).forEach(m=>{
        const div=document.createElement('div');
        div.className='match-card';
        div.innerHTML=`
            <div>Court ${m.court}<br>${m.p[0]} & ${m.p[1]}</div>
            <div class="flex gap-2">
                <input type="number" oninput="upd(${m.id},'A',this.value)">
                <input type="number" oninput="upd(${m.id},'B',this.value)">
            </div>
            <div>Court ${m.court}<br>${m.p[2]} & ${m.p[3]}</div>
        `;
        container.appendChild(div);
    });
}

function upd(id, team, val){
    const m = matches.find(x=>x.id===id);
    if(team==='A') m.sA=val; else m.sB=val;
    updateBoard();
}

function updateBoard(){
    let l={}; players.forEach(p=>l[p]={pts:0,diff:0});
    const mode=document.getElementById('modeSelect').value;
    matches.forEach(m=>{
        const a=parseInt(m.sA)||0, b=parseInt(m.sB)||0;
        if(m.sA===''||m.sB==='') return;
        m.p.slice(0,2).forEach(p=>l[p].diff+=(a-b));
        m.p.slice(2,4).forEach(p=>l[p].diff+=(b-a));
        if(mode==='classic'){
            if(a>b) m.p.slice(0,2).forEach(p=>l[p].pts+=3);
            else if(b>a) m.p.slice(2,4).forEach(p=>l[p].pts+=3);
            else m.p.forEach(p=>l[p].pts+=1);
        } else {
            m.p.slice(0,2).forEach(p=>l[p].pts+=a);
            m.p.slice(2,4).forEach(p=>l[p].pts+=b);
        }
    });
    const sorted=Object.entries(l).sort((a,b)=>b[1].pts-a[1].pts || b[1].diff-a[1].diff);
    document.getElementById('leaderboardBody').innerHTML=sorted.map(([n,d],i)=>`
        <tr class="border-b border-gray-300">
            <td class="p-2 text-gray-700 font-bold">#${i+1}</td>
            <td class="p-2 font-bold text-xs uppercase">${n}</td>
            <td class="p-2 text-yellow-500 font-black">${d.pts}</td>
            <td class="p-2 text-[10px] ${d.diff>=0?'text-green-500':'text-red-500'}">${d.diff>0?'+':''}${d.diff}</td>
        </tr>
    `).join('');
    document.getElementById('leaderboardSection').classList.remove('hidden');
}

function downloadResults(){
    html2canvas(document.getElementById('leaderboardSection'),{backgroundColor:'#fff',scale:2}).then(canvas=>{
        const link=document.createElement('a'); link.download='standings.png'; link.href=canvas.toDataURL(); link.click();
    });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
