<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

body{
background:#f8fafc;
color:#0f172a;
margin:0;
font-family:'Space Grotesk',sans-serif;
}

/* BRAND BANNER */
.brand-banner{
background:white;
position:relative;
overflow:hidden;
border-bottom:1px solid #e2e8f0;
}

.brand-banner h1{
font-size:42px;
font-weight:800;
letter-spacing:-1px;
position:relative;
z-index:2;
color:#0f172a;
}

/* Neon vertical strip */
.brand-strip{
position:absolute;
left:50%;
top:0;
height:100%;
width:6px;
background:#22c55e;
box-shadow:0 0 20px #22c55e;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:.4}
50%{opacity:1}
100%{opacity:.4}
}

/* Cards */
.card{
background:white;
border-radius:22px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.05);
border:1px solid #e2e8f0;
}

/* Buttons */
.btn-primary{
background:#2563eb;
color:white;
padding:12px;
border-radius:14px;
font-weight:700;
}

.btn-accent{
background:#22c55e;
color:white;
padding:12px;
border-radius:14px;
font-weight:700;
}

.input{
background:#f1f5f9;
border:none;
padding:12px;
border-radius:12px;
width:100%;
margin-bottom:10px;
}
</style>
</head>

<body>

<!-- BRAND HEADER -->
<div class="brand-banner p-8 text-center">
<div class="brand-strip"></div>
<h1>PADELPILOT</h1>
<p class="text-sm text-slate-400 mt-2">Smart Session Engine</p>
</div>

<!-- TOURNAMENT SELECTOR -->
<div class="p-4 max-w-md mx-auto space-y-4">

<div class="card">
<h2 class="font-bold text-lg mb-3">Create Tournament</h2>

<button onclick="setMode('classic_americano')" class="btn-primary w-full mb-2">
Classic Americano
</button>

<button onclick="setMode('mixed_americano')" class="btn-primary w-full mb-2">
Mixed Americano
</button>

<button onclick="setMode('team_americano')" class="btn-accent w-full">
Team Americano
</button>
</div>

</div>

<!-- MAIN ARENA -->
<div class="p-4 max-w-4xl mx-auto">

<div class="card">

<input id="meetNameInput" placeholder="Meet name" class="input">

<textarea id="playersInput" class="input" style="height:140px" placeholder="Enter players"></textarea>

<button id="savePlayersBtn" class="btn-accent w-full mt-2">
Sync Players
</button>

<button id="generateBtn" class="btn-primary w-full mt-3">
Generate Round
</button>

</div>

<div id="matchesSection" class="mt-6"></div>
<div id="leaderboardSection" class="mt-6"></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* STATE */
let players=[];
let matches=[];
let currentRound=1;
let activeMeetId=null;
let tournamentMode="classic";

/* MODE SELECT */
function setMode(mode){
tournamentMode=mode;
alert("Mode: "+mode);
}

/* CONNECT MEET + 48h RESET */
function connectToMeet(id){
activeMeetId=id.replace(/\s+/g,'-').toLowerCase();
const ref=db.ref('meets/'+activeMeetId);

ref.once('value').then(snap=>{
let data=snap.val();

if(data){
const age=Date.now()-data.createdAt;

if(age>48*60*60*1000){
ref.set({
createdAt:Date.now(),
players:"",
matches:""
});
alert("Session expired. Resetting meet.");
return;
}

document.getElementById('playersInput').value=data.players||"";
players=data.players?data.players.split('\n'):[];
}
else{
ref.set({
createdAt:Date.now(),
players:"",
matches:""
});
}
});
}

/* SAVE PLAYERS */
document.getElementById('savePlayersBtn').onclick=()=>{
const name=document.getElementById('meetNameInput').value;
if(!name) return alert("Enter meet name");

connectToMeet(name);

const list=document.getElementById('playersInput').value;

db.ref('meets/'+activeMeetId).update({
players:list,
createdAt:Date.now()
});
};
