<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#ffffff; font-family:'Space Grotesk', sans-serif; margin:0; }

.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;
display:flex;
justify-content:center;
gap:40px;
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
}

.top-tabs a{color:white;text-decoration:none;font-size:13px;}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px;}

.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}

.arena-banner{
background:linear-gradient(90deg,#2563eb,#facc15);
color:#0f172a;text-align:center;padding:26px;
font-size:32px;font-weight:900;letter-spacing:.15em;
}

.match-card{
background:linear-gradient(135deg,#f1f5f9,#e0f2fe);
border-radius:24px;padding:28px;
display:flex;justify-content:space-between;align-items:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.team-block{
width:40%;font-size:22px;font-weight:800;color:#0f172a;
}

.score-box input{
width:70px;height:60px;font-size:26px;text-align:center;
border-radius:14px;border:2px solid #e5e7eb;
}
</style>
</head>

<body>

<!-- TOP NAV -->
<div class="top-tabs">
<a href="arena.html" class="active">Arena</a>
<a href="leaderboard.html">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="arena-banner">ARENA</div>

<div class="max-w-5xl mx-auto p-6 space-y-6">

<!-- TOURNAMENT INFO -->
<div class="bg-gray-100 p-6 rounded-2xl shadow">

<input id="tournamentName" class="w-full text-2xl font-bold mb-4 p-2 border rounded"
placeholder="Tournament Name">

<div class="flex gap-4">
<input id="locationInput" class="flex-1 p-2 border rounded" placeholder="Location">
<input id="timeInput" class="flex-1 p-2 border rounded" placeholder="Start Time">
<button onclick="copyMatchLink()" class="bg-blue-600 text-white px-6 rounded">Copy Link</button>
</div>

</div>

<!-- SETUP -->
<div class="bg-gray-100 p-6 rounded-2xl shadow space-y-4">

<select id="tournamentType" class="w-full p-3 rounded border">
<option value="classic">Classic 3 Point</option>
<option value="teamclassic">Team Classic 3 Point</option>
<option value="americano">Classic Americano</option>
<option value="mixed">Mixed Americano</option>
<option value="teamamericano">Team Americano</option>
</select>

<textarea id="playersInput" class="w-full p-3 border rounded h-36"
placeholder="Enter player or team names"></textarea>

<div class="flex gap-4">
<input id="courtsInput" type="number" min="1" value="1" class="w-24 p-2 border rounded">
<button onclick="saveSetup()" class="bg-green-600 text-white px-6 rounded">Sync</button>
<button onclick="generateMatches()" class="bg-yellow-400 px-6 rounded font-bold">Generate Round</button>
</div>

</div>

<!-- MATCHES -->
<div id="matchesContainer" class="space-y-6"></div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let meetId=new URLSearchParams(window.location.search).get('meet');

function copyMatchLink(){
if(!meetId) return alert("Create tournament first");
const link=location.href.split('?')[0]+"?meet="+meetId;
navigator.clipboard.writeText(link);
alert("Link copied");
}

function saveSetup(){
const name=document.getElementById('tournamentName').value;
if(!name) return alert("Tournament name required");

meetId=name.replace(/\s+/g,'-').toLowerCase();

db.ref('arena/'+meetId).set({
name,
players:document.getElementById('playersInput').value,
location:locationInput.value,
time:timeInput.value,
type:tournamentType.value,
timestamp:Date.now()
});
}

function generateMatches(){

let raw=document.getElementById('playersInput').value
.split('\n').filter(x=>x.trim());

let shuffled=[...raw].sort(()=>0.5-Math.random());
let courts=parseInt(courtsInput.value)||1;
let container=document.getElementById('matchesContainer');
container.innerHTML='';

for(let i=0;i<courts*4;i+=4){
if(!shuffled[i+3]) break;

let card=document.createElement('div');
card.className='match-card';

card.innerHTML=`
<div class="team-block">${shuffled[i]}<br>${shuffled[i+1]}</div>

<div class="score-box">
<input type="number" placeholder="0">
<span class="px-3 font-bold">vs</span>
<input type="number" placeholder="0">
</div>

<div class="team-block text-right">${shuffled[i+2]}<br>${shuffled[i+3]}</div>
`;

container.appendChild(card);
}

db.ref('arena/'+meetId+'/matches').set(shuffled);
}
</script>

</body>
</html>
