<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Tournament</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
    body { background-color: #ffffff; color: #111827; margin: 0; font-family: 'Space Grotesk', sans-serif; padding-bottom: 100px; }
    
    .padel-banner {
        background: linear-gradient(-45deg, #1e40af, #3b82f6, #fbbf24, #2563eb);
        background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        padding: 1rem; text-align: center; color: white;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .arena-banner {
        background-color: #0f172a; color: white; text-align: center; padding: 1rem; margin-bottom: 1rem;
    }

    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); }

    .tab-view { display: none; }
    .active-tab { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .nav-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; z-index: 100; }

    .editable-input { background: transparent; border: none; font-weight: 700; color: white; outline: none; width: 100%; }
    .editable-input:focus { background: rgba(255,255,255,0.05); border-radius: 4px; }
</style>
</head>
<body>

<!-- PadelPilot Banner -->
<div class="padel-banner font-black text-2xl uppercase tracking-wide">
    PADELPILOT
</div>

<!-- Arena Banner -->
<div class="arena-banner rounded-b-xl">
    <h1 class="text-3xl font-bold uppercase tracking-tight">THE ARENA</h1>
    <p class="text-xs uppercase tracking-widest opacity-60 mt-1">Live Session Control</p>
</div>

<div class="p-4 max-w-4xl mx-auto">

    <div id="view-arena" class="tab-view active-tab space-y-6">

        <!-- Tournament Info -->
        <div class="max-w-md mx-auto w-full">
            <div class="glass-card p-5 rounded-2xl border border-gray-200 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10 mb-4">
                    <div class="w-1/2">
                        <p class="text-[10px] font-bold text-yellow-400 uppercase tracking-widest mb-1">Tournament Name</p>
                        <input id="tournamentNameInput" type="text" value="" class="editable-input text-lg" placeholder="Enter tournament name">
                    </div>
                    <div class="text-right border-l border-white/10 pl-6 w-1/2">
                        <p class="text-[10px] font-bold text-yellow-400 uppercase tracking-widest mb-1">📍 Location</p>
                        <input id="locInput" type="text" value="Constantia Hub" class="editable-input text-lg">
                    </div>
                </div>

                <div class="flex justify-between items-center mb-4">
                    <div class="w-1/2">
                        <p class="text-[10px] font-bold text-yellow-400 uppercase tracking-widest mb-1">⏰ Start Time</p>
                        <input id="timeInput" type="text" value="09:00 AM" class="editable-input text-lg text-right">
                    </div>
                    <div class="text-right">
                        <button onclick="copyMatchLink()" class="bg-blue-500/20 border border-blue-500/50 text-blue-400 px-3 py-2 rounded-xl font-bold text-sm">🔗 Copy Link</button>
                    </div>
                </div>

                <button id="connectTournamentBtn" class="w-full bg-green-500 text-white font-black py-2 rounded-xl uppercase mb-2">Connect Tournament</button>
                <button id="savePlayersBtn" class="w-full bg-yellow-400 text-blue-900 font-black py-2 rounded-xl uppercase">💾 Save Tournament</button>
            </div>
        </div>

        <!-- Players & Match Settings -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-100/80 p-6 rounded-2xl shadow-lg">
                <h3 class="text-xs font-bold uppercase text-blue-400 mb-4 tracking-widest text-center">Players / Teams</h3>

                <textarea id="playersInput" class="w-full bg-white border border-gray-400 p-3 rounded-xl h-40 outline-none text-gray-800 text-sm mb-4" placeholder="Enter player names or team names, one per line"></textarea>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <input id="courtsInput" type="number" value="1" min="1" class="bg-white p-2 rounded-lg border border-gray-400 text-gray-800 text-center text-sm">
                    <select id="modeSelect" class="bg-white p-2 rounded-lg border border-gray-400 text-gray-800 text-sm">
                        <option value="classic">Classic 3 Point</option>
                        <option value="team-classic">Team Classic 3 Point</option>
                        <option value="americano">Classic Americano</option>
                        <option value="mixed-americano">Mixed Americano</option>
                        <option value="team-americano">Team Americano</option>
                    </select>
                </div>

                <button id="generateBtn" class="w-full bg-blue-600 text-white font-black py-2 rounded-xl uppercase shadow-lg hover:scale-105 transition-transform">Generate Round</button>
            </div>

            <!-- Matches & Leaderboard -->
            <div class="md:col-span-2 space-y-4">
                <div id="matchesSection" class="hidden">
                    <div class="flex justify-between items-center mb-4 bg-gray-200 p-2 rounded-xl">
                        <h2 id="roundDisplay" class="text-xl font-black uppercase text-yellow-400">Round 1</h2>
                        <button id="nextBtn" class="bg-green-500 px-4 py-1 rounded-full font-bold text-xs uppercase">Next Round</button>
                    </div>
                    <div id="matchesContainer" class="grid grid-cols-1 gap-3"></div>
                    <div id="restingContainer" class="mt-4 p-2 bg-yellow-400/10 rounded-lg text-yellow-800 text-xs text-center font-bold italic border border-yellow-400/20"></div>
                </div>

                <div id="leaderboardSection" class="hidden bg-gray-100 rounded-2xl overflow-hidden border border-gray-300 shadow-lg">
                    <div class="p-4 bg-gray-200 flex justify-between items-center border-b border-gray-300">
                        <span class="font-bold text-[10px] tracking-widest uppercase">Standings</span>
                        <button onclick="downloadResults()" class="text-[8px] bg-white/20 px-3 py-1 rounded-full font-bold uppercase border border-white/20">Export PNG</button>
                    </div>
                    <table class="w-full text-left text-sm">
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bottom Tabs -->
<div class="nav-dock glass-card p-2 rounded-2xl flex justify-around items-center border border-gray-300 shadow-lg">
    <button onclick="switchTab('arena')" class="flex-1 text-center p-2 font-bold uppercase">Arena</button>
    <button onclick="switchTab('rules')" class="flex-1 text-center p-2 font-bold uppercase">Rules</button>
    <button onclick="switchTab('leaderboard')" class="flex-1 text-center p-2 font-bold uppercase">Leaderboard</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
    authDomain: "padelpilot-4531f.firebaseapp.com",
    databaseURL: "https://padelpilot-4531f-default-rtdb.firebaseio.com/",
    projectId: "padelpilot-4531f",
    storageBucket: "padelpilot-4531f.appspot.com",
    messagingSenderId: "866905934997",
    appId: "1:866905934997:web:97cb8ebc4ed35f9e41f9c",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Global Variables
let players = [], matches = [], currentRound = 1;
let activeMeetId = null;

// Copy Match Link
function copyMatchLink() {
    if (!activeMeetId) return alert("Create tournament first!");
    const url = window.location.href.split('?')[0] + "?tournament=" + activeMeetId;
    navigator.clipboard.writeText(url).then(() => alert("Tournament link copied!"));
}

// Switch Tabs
function switchTab(tab) {
    document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active-tab'));
    if(tab==='arena') document.getElementById('view-arena').classList.add('active-tab');
}

// Connect Tournament
document.getElementById('connectTournamentBtn').onclick = () => {
    const name = document.getElementById('tournamentNameInput').value;
    if (!name) return alert("Enter a tournament name!");
    activeMeetId = name.replace(/\s+/g,'-').toLowerCase();
    db.ref('tournaments/' + activeMeetId).once('value').then(snapshot => {
        const data = snapshot.val();
        if(data) {
            const age = Date.now() - data.timestamp;
            if(age > 48*60*60*1000) {
                alert("Tournament expired. Starting fresh.");
                return;
            }
            if(data.players) document.getElementById('playersInput').value = data.players;
            if(data.location) document.getElementById('locInput').value = data.location;
            if(data.time) document.getElementById('timeInput').value = data.time;
            players = data.players ? data.players.split('\n').filter(p=>p.trim()) : [];
            alert("Tournament loaded from Firebase!");
        }
    });
};

// Save Tournament (48h persistence)
document.getElementById('savePlayersBtn').onclick = function() {
    if (!activeMeetId) return alert("Connect to a Tournament first!");
    const list = document.getElementById('playersInput').value;
    const loc = document.getElementById('locInput').value;
    const time = document.getElementById('timeInput').value;
    const now = Date.now();
    db.ref('tournaments/' + activeMeetId).set({
        players: list,
        location: loc,
        time: time,
        timestamp: now
    }).then(()=>alert("Tournament saved! Data will persist 48 hours."));
};

// Generate Matches
document.getElementById('generateBtn').onclick = () => {
    const raw = document.getElementById('playersInput').value.split('\n').filter(p=>p.trim());
    if(raw.length<4) return alert("Add 4+ players!");
    players = raw; matches = []; currentRound = 1;
    startRound();
};

document.getElementById('nextBtn').onclick = () => { currentRound++; startRound(); };

function startRound() {
    const courts = parseInt(document.getElementById('courtsInput').value)||1;
    const shuffled = [...players].sort(()=>0.5 - Math.random());
    const newMatches = [];
    for(let i=0;i<courts*4 && i+3<shuffled.length;i+=4){
        newMatches.push({id:Date.now()+i,court:(i/4)+1,p:[shuffled[i],shuffled[i+1],shuffled[i+2],shuffled[i+3]],sA:'',sB:''});
    }
    const resting = shuffled.slice(newMatches.length*4);
    document.getElementById('restingContainer').textContent = resting.length?`Resting: ${resting.join(', ')}`:'Full court engagement!';
    document.getElementById('roundDisplay').textContent = `Round ${currentRound}`;
    matches = [...matches,...newMatches];
    render(); updateBoard();
}

function render() {
    const container = document.getElementById('matchesContainer'); container.innerHTML='';
    const count = parseInt(document.getElementById('courtsInput').value)||1;
    matches.slice(-count).forEach(m=>{
        const div = document.createElement('div');
        div.className='bg-gray-200 p-4 rounded-2xl flex justify-between items-center border border-gray-400';
        div.innerHTML=`
            <div class="text-xs font-bold w-1/3 text-yellow-600 uppercase">${m.p[0]} & ${m.p[1]}</div>
            <div class="flex gap-2">
                <input type="number" oninput="upd(${m.id},'A',this.value)" class="w-12 bg-white rounded p-1 text-center border border-gray-300">
                <input type="number" oninput="upd(${m.id},'B',this.value)" class="w-12 bg-white rounded p-1 text-center border border-gray-300">
            </div>
            <div class="text-xs font-bold w-1/3 text-right text-blue-600 uppercase">${m.p[2]} & ${m.p[3]}</div>
        `;
        container.appendChild(div);
    });
    document.getElementById('matchesSection').classList.remove('hidden');
}

function upd(id,team,val){
    const m=matches.find(x=>x.id===id);
    if(team==='A') m.sA=val; else m.sB=val;
    updateBoard();
}

function updateBoard(){
    let l={}; players.forEach(p=>l[p]={pts:0,diff:0});
    const mode=document.getElementById('modeSelect').value;
    matches.forEach(m=>{
        const a=parseInt(m.sA)||0,b=parseInt(m.sB)||0;
        if(m.sA===''||m.sB==='') return;
        m.p.slice(0,2).forEach(p=>l[p].diff+=(a-b));
        m.p.slice(2,4).forEach(p=>l[p].diff+=(b-a));
        if(mode==='classic'){ if(a>b) m.p.slice(0,2).forEach(p=>l[p].pts+=3); else if(b>a) m.p.slice(2,4).forEach(p=>l[p].pts+=3); else m.p.forEach(p=>l[p].pts+=1); }
        else{ m.p.slice(0,2).forEach(p=>l[p].pts+=a); m.p.slice(2,4).forEach(p=>l[p].pts+=b); }
    });
    const sorted=Object.entries(l).sort((a,b)=>b[1].pts-a[1].pts||b[1].diff-a[1].diff);
    document.getElementById('leaderboardBody').innerHTML=sorted.map(([n,d],i)=>`
        <tr class="border-b border-gray-300">
            <td class="p-3 text-gray-500 font-bold">#${i+1}</td>
            <td class="p-3 font-bold text-xs uppercase">${n}</td>
            <td class="p-3 text-yellow-600 font-black">${d.pts}</td>
            <td class="p-3 text-xs font-bold ${d.diff>=0?'text-green-600':'text-red-600'}">${d.diff>0?'+':''}${d.diff}</td>
        </tr>
    `).join('');
    document.getElementById('leaderboardSection').classList.remove('hidden');
}

function downloadResults(){
    html2canvas(document.getElementById('leaderboardSection'),{backgroundColor:'#ffffff',scale:2}).then(canvas=>{
        const link=document.createElement('a'); link.download='standings.png'; link.href=canvas.toDataURL(); link.click();
    });
}

// On page load: restore tournament if URL has ?tournament=
const urlTournament = new URLSearchParams(window.location.search).get('tournament');
if(urlTournament) {
    document.getElementById('tournamentNameInput').value = urlTournament;
    document.getElementById('connectTournamentBtn').click();
}
</script>

</body>
</html>
