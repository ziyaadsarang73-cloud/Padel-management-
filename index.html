<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Padel Match Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-900 text-white p-6">
  <div class="w-full bg-blue-800 text-white py-5 px-6 rounded-lg shadow-lg mb-6 flex items-center gap-4">
  <div class="text-4xl">🎾</div>
  <div>
    <h1 class="text-3xl font-bold">PadelPilot</h1>
    <p class="text-sm opacity-90">Racky is ready to assist</p>
  </div>
  </div>

  <h1 class="text-3xl font-bold mb-4">Padel Match Generator</h1>

  <!-- INPUTS -->
  <div class="mb-4">
    <label class="block mb-1">Enter one player per line:</label>
    <textarea id="playersInput" class="w-full p-2 bg-gray-800 rounded" rows="6"></textarea>
  </div>

  <div class="mb-4">
    <label class="block mb-1">Number of courts:</label>
    <input id="courtsInput" type="number" class="w-24 p-2 bg-gray-800 rounded">
  </div>

  <div class="mb-4">
    <label class="block mb-1">Mode:</label>
    <select id="modeSelect" class="p-2 bg-gray-800 rounded">
      <option value="classic">Classic</option>
      <option value="americano">Americano (Winner = 1, Loser = 0)</option>
    </select>
  </div>

  <button id="generateBtn" class="bg-blue-600 px-4 py-2 rounded mr-2">Generate Matches</button>
  <button id="resetBtn" class="bg-red-600 px-4 py-2 rounded">Reset</button>

  <h2 id="roundDisplay" class="text-2xl font-bold mt-6 hidden">Round 1</h2>

  <!-- MATCHES SECTION -->
  <div id="matchesSection" class="mt-4 hidden">
    <h3 class="text-xl font-semibold mb-2">Matches</h3>
    <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    <p id="restingContainer" class="mt-2 text-yellow-300"></p>
  </div>

  <!-- NEXT ROUND -->
  <button id="nextRoundBtn" class="bg-green-600 px-4 py-2 rounded mt-4 hidden">Next Round</button>

  <!-- LEADERBOARD -->
  <div id="leaderboardSection" class="mt-8 hidden">
    <h3 class="text-xl font-semibold mb-2">Leaderboard</h3>
    <table class="w-full text-left">
      <thead>
        <tr>
          <th class="px-2 py-1">#</th>
          <th class="px-2 py-1">Player</th>
          <th class="px-2 py-1">Points</th>
          <th class="px-2 py-1">Matches</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

  <!-- SCRIPT -->
  <script>
    // RACKY'S BRAIN
const rackyBrain = {
  greetings: [
    "Hey champ, ready to play?",
    "Racky here — need a quick rule refresher?",
    "Let’s get this round rolling!"
  ],
  rules: {
    americano: "Americano: Each match is 24 points. Switch sides at 12.",
    classic: "Classic scoring: 3 points for a win, 1 for a draw.",
    goldenPoint: "Golden point: At 40–40, one point decides the game."
  },
  tips: [
    "Rotate courts every round to keep things fair.",
    "Try mixing strong and new players for balanced matches.",
    "Remember to hydrate — padel gets intense fast."
  ],
  reactions: {
    matchesGenerated: "Nice! I’ve prepared your courts. Good luck out there.",
    scoresUpdated: "Scores updated. Smooth work!",
    playersAdded: "Players loaded. Ready to generate matches?"
  }
};function rackySay(message) {
  document.getElementById("mascotText").textContent = message;
}
    // STATE
    let players = [];
    let matches = [];
    let leaderboard = {};
    let currentRound = 1;

    // DOM ELEMENTS
    const playersInput = document.getElementById('playersInput');
    const courtsInput = document.getElementById('courtsInput');
    const modeSelect = document.getElementById('modeSelect');
    const generateBtn = document.getElementById('generateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const nextRoundBtn = document.getElementById('nextRoundBtn');
    const matchesSection = document.getElementById('matchesSection');
    const matchesContainer = document.getElementById('matchesContainer');
    const restingContainer = document.getElementById('restingContainer');
    const leaderboardSection = document.getElementById('leaderboardSection');
    const leaderboardBody = document.getElementById('leaderboardBody');
    const roundDisplay = document.getElementById('roundDisplay');

    // SHUFFLE
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // INIT LEADERBOARD
    function initLeaderboard() {
      leaderboard = {};
      players.forEach(p => {
        leaderboard[p] = { points: 0, matches: 0 };
      });
    }

    // GENERATE MATCHES
    function generateMatches(courts) {
      matches = [];
      const shuffled = shuffle(players);

      const groups = [];
      for (let i = 0; i < shuffled.length; i += 4) {
        groups.push(shuffled.slice(i, i + 4));
      }

      const usedGroups = groups.slice(0, courts);
      const resting = groups.slice(courts).flat();

      usedGroups.forEach((group, idx) => {
        if (group.length < 4) return;
        matches.push({
          id: idx + 1,
          court: idx + 1,
          players: group,
          scoreA: '',
          scoreB: '',
          scored: false
        });
      });

      renderResting(resting);
    }

    // RENDER MATCHES
    function renderMatches() {
      matchesContainer.innerHTML = '';

      matches.forEach(match => {
        const div = document.createElement('div');
        div.className = 'bg-gray-800 p-3 rounded';

        div.innerHTML = `
          <div class="font-semibold mb-1">Court ${match.court}</div>
          <div class="text-sm mb-2">
            <span class="text-green-300">${match.players[0]}</span> &
            <span class="text-green-300">${match.players[1]}</span>
            vs
            <span class="text-blue-300">${match.players[2]}</span> &
            <span class="text-blue-300">${match.players[3]}</span>
          </div>
          <div class="flex gap-2">
            <input type="number" min="0" class="w-16 p-1 bg-gray-700 rounded text-center"
              placeholder="A" data-match="${match.id}" data-team="A">
            <input type="number" min="0" class="w-16 p-1 bg-gray-700 rounded text-center"
              placeholder="B" data-match="${match.id}" data-team="B">
          </div>
        `;

        matchesContainer.appendChild(div);
      });
    }

    // RESTING PLAYERS
    function renderResting(resting) {
      restingContainer.textContent =
        resting.length ? 'Resting: ' + resting.join(', ') : '';
    }

    // UPDATE LEADERBOARD
    function updateLeaderboard() {
      leaderboardBody.innerHTML = '';

      const sorted = Object.entries(leaderboard)
        .sort((a, b) => b[1].points - a[1].points);

      sorted.forEach(([player, data], index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="px-2 py-1">${index + 1}</td>
          <td class="px-2 py-1">${player}</td>
          <td class="px-2 py-1">${data.points}</td>
          <td class="px-2 py-1">${data.matches}</td>
        `;
        leaderboardBody.appendChild(row);
      });
    }

    // APPLY SCORES
    function applyScores(match) {
      const a = parseInt(match.scoreA, 10);
      const b = parseInt(match.scoreB, 10);

      if (isNaN(a) || isNaN(b)) return;
      if (match.scored) return;

      match.scored = true;

      const mode = modeSelect.value;

      if (mode === 'classic') {
        if (a > b) {
          leaderboard[match.players[0]].points += 3;
          leaderboard[match.players[1]].points += 3;
        } else if (b > a) {
          leaderboard[match.players[2]].points += 3;
          leaderboard[match.players[3]].points += 3;
        } else {
          match.players.forEach(p => leaderboard[p].points += 1);
        }
      }

      if (mode === 'americano') {
        if (a > b) {
          leaderboard[match.players[0]].points += 1;
          leaderboard[match.players[1]].points += 1;
        } else if (b > a) {
          leaderboard[match.players[2]].points += 1;
          leaderboard[match.players[3]].points += 1;
        }
      }

      match.players.forEach(p => leaderboard[p].matches++);
    }

    // SCORE LISTENER
    document.addEventListener('input', e => {
      if (e.target.matches('input[data-match]')) {
        const id = parseInt(e.target.dataset.match, 10);
        const team = e.target.dataset.team;
        const match = matches.find(m => m.id === id);

        if (!match) return;

        if (team === 'A') match.scoreA = e.target.value;
        if (team === 'B') match.scoreB = e.target.value;

        applyScores(match);
        updateLeaderboard();
        saveState();
      }
    });

    // GENERATE BUTTON
    generateBtn.addEventListener('click', () => {
      const rawPlayers = playersInput.value
        .split('\n')
        .map(p => p.trim())
        .filter(p => p);

      if (rawPlayers.length < 4) {
        alert('Enter at least 4 players');
        return;
      }

      const courts = parseInt(courtsInput.value, 10);
      if (isNaN(courts) || courts < 1) {
        alert('Enter valid number of courts');
        return;
      }

      players = rawPlayers;
      currentRound = 1;

      initLeaderboard();
      generateMatches(courts);
      renderMatches();
      updateLeaderboard();

      matchesSection.classList.remove('hidden');
      leaderboardSection.classList.remove('hidden');
      nextRoundBtn.classList.remove('hidden');
      roundDisplay.classList.remove('hidden');
      roundDisplay.textContent = `Round ${currentRound}`;

      saveState();
    });

    // NEXT ROUND
    nextRoundBtn.addEventListener('click', () => {
      currentRound++;
      roundDisplay.textContent = `Round ${currentRound}`;

      const courts = parseInt(courtsInput.value, 10);
      generateMatches(courts);
      renderMatches();

      saveState();
    });

    // RESET
    resetBtn.addEventListener('click', () => {
      localStorage.removeItem('padelState');
      location.reload();
    });

    // SAVE STATE
    function saveState() {
      const state = {
        players,
        matches,
        leaderboard,
        currentRound,
        mode: modeSelect.value,
        courts: courtsInput.value,
        playersText: playersInput.value
      };
      localStorage.setItem('padelState', JSON.stringify(state));
    }

    // LOAD STATE
    rackySay(rackyBrain.greetings[0]);
    function loadState() {
      const saved = localStorage.getItem('padelState');
      if (!saved) return;

      const state = JSON.parse(saved);

      players = state.players || [];
      matches = state.matches || [];
      leaderboard = state.leaderboard || {};
      currentRound = state.currentRound || 1;

      modeSelect.value = state.mode || 'classic';
      courtsInput.value = state.courts || '';
      playersInput.value = state.playersText || '';
      rackySay(rackyBrain.reactions.playersAdded);

      if (players.length > 0) {
        renderMatches();
        rackySay(rackyBrain.reactions.matchesGenerated);
        updateLeaderboard();
        matchesSection.classList.remove('hidden');
        leaderboardSection.classList.remove('hidden');
        nextRoundBtn.classList.remove('hidden');
        roundDisplay.classList.remove('hidden');
        roundDisplay.textContent = `Round ${currentRound}`;
      }
    }
// Mascot toggle
document.getElementById("mascotButton").addEventListener("click", () => {
  document.getElementById("mascotPanel").classList.toggle("hidden");
});
    loadState();
    rackySay(rackyBrain.greetings[0]);
  </script>
  <script>
  // RACKY'S BRAIN
  const rackyBrain = {
    greetings: [
      "Hey champ, ready to play?",
      "Racky here – need a quick rule refresher?",
      "Let’s get this ball rolling!"
    ],
    rules: {
      americano: "Americano: Each match is 24 points. Switch sides at 12.",
      classic: "Classic scoring: 3 points for a win, 1 for a draw.",
      goldenPoint: "Golden point: At 40–40, one point decides the game."
    },
    tips: [
      "Rotate courts every round to keep things fair.",
      "Try mixing strong and new players for balanced matches.",
      "Remember to hydrate — padel gets intense fast."
    ],
    reactions: {
      matchesGenerated: "Nice! I’ve prepared your courts. Good luck out there.",
      scoresUpdated: "Scores updated. Smooth work!",
      playersAdded: "Players loaded. Ready to generate matches?"
    }
  };

  function rackySay(message) {
    const el = document.getElementById("mascotText");
    if (el) el.textContent = message;
  }

  // STATE
  let players = [];
  let matches = [];
  let leaderboard = {};
  let currentRound = 1;

  // DOM ELEMENTS
  const playersInput = document.getElementById('playersInput');
  const courtsInput = document.getElementById('courtsInput');
  const modeSelect = document.getElementById('modeSelect');
  const generateBtn = document.getElementById('generateBtn');
  const resetBtn = document.getElementById('resetBtn');
  const nextRoundBtn = document.getElementById('nextRoundBtn');
  const matchesSection = document.getElementById('matchesSection');
  const matchesContainer = document.getElementById('matchesContainer');
  const restingContainer = document.getElementById('restingContainer');
  const leaderboardSection = document.getElementById('leaderboardSection');
  const leaderboardBody = document.getElementById('leaderboardBody');
  const roundDisplay = document.getElementById('roundDisplay');

  // SHUFFLE
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // INIT LEADERBOARD
  function initLeaderboard() {
    leaderboard = {};
    players.forEach(p => {
      leaderboard[p] = { points: 0, matches: 0 };
    });
  }

  // GENERATE MATCHES
  function generateMatches(courts) {
    matches = [];
    const shuffled = shuffle(players);

    const groups = [];
    for (let i = 0; i < shuffled.length; i += 4) {
      groups.push(shuffled.slice(i, i + 4));
    }

    const usedGroups = groups.slice(0, courts);
    const resting = groups.slice(courts).flat();

    usedGroups.forEach((group, idx) => {
      if (group.length < 4) return;
      matches.push({
        id: idx + 1,
        court: idx + 1,
        players: group,
        scoreA: '',
        scoreB: '',
        scored: false
      });
    });

    renderResting(resting);
  }

  // RENDER MATCHES
  function renderMatches() {
    matchesContainer.innerHTML = '';

    matches.forEach(match => {
      const div = document.createElement('div');
      div.className = 'bg-gray-800 p-3 rounded';

      const [p1, p2, p3, p4] = match.players;

      div.innerHTML = `
        <div class="font-semibold mb-1">Court ${match.court}</div>
        <div class="text-sm mb-2">
          <span class="text-green-300">${p1}</span> &amp;
          <span class="text-green-300">${p2}</span>
          vs
          <span class="text-blue-300">${p3}</span> &amp;
          <span class="text-blue-300">${p4}</span>
        </div>
        <div class="flex gap-2">
          <input type="number" min="0" class="w-16 bg-gray-900 p-1 rounded"
            placeholder="A" data-match="${match.id}" data-team="A">
          <input type="number" min="0" class="w-16 bg-gray-900 p-1 rounded"
            placeholder="B" data-match="${match.id}" data-team="B">
        </div>
      `;

      matchesContainer.appendChild(div);
    });
  }

  // RESTING PLAYERS
  function renderResting(resting) {
    restingContainer.textContent =
      resting.length ? 'Resting: ' + resting.join(', ') : '';
  }

  // UPDATE LEADERBOARD
  function updateLeaderboard() {
    leaderboardBody.innerHTML = '';

    const sorted = Object.entries(leaderboard)
      .sort((a, b) => b[1].points - a[1].points);

    sorted.forEach(([player, data], index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="px-2 py-1">${index + 1}</td>
        <td class="px-2 py-1">${player}</td>
        <td class="px-2 py-1">${data.points}</td>
        <td class="px-2 py-1">${data.matches}</td>
      `;
      leaderboardBody.appendChild(row);
    });
  }

  // APPLY SCORES
  function applyScores(match) {
    const a = parseInt(match.scoreA, 10);
    const b = parseInt(match.scoreB, 10);

    if (isNaN(a) || isNaN(b)) return;
    if (match.scored) return;

    match.scored = true;

    const mode = modeSelect.value;

    if (mode === 'classic') {
      if (a > b) {
        leaderboard[match.players[0]].points += 3;
        leaderboard[match.players[1]].points += 3;
      } else if (b > a) {
        leaderboard[match.players[2]].points += 3;
        leaderboard[match.players[3]].points += 3;
      } else {
        match.players.forEach(p => leaderboard[p].points += 1);
      }
    }

    if (mode === 'americano') {
      if (a > b) {
        leaderboard[match.players[0]].points += 1;
        leaderboard[match.players[1]].points += 1;
      } else if (b > a) {
        leaderboard[match.players[2]].points += 1;
        leaderboard[match.players[3]].points += 1;
      }
    }

    match.players.forEach(p => leaderboard[p].matches++);
    updateLeaderboard();
    saveState();
    rackySay(rackyBrain.reactions.scoresUpdated);
  }

  // SCORE LISTENER
  document.addEventListener('input', e => {
    if (e.target.matches('input[data-match]')) {
      const id = parseInt(e.target.dataset.match, 10);
      const team = e.target.dataset.team;
      const match = matches.find(m => m.id === id);

      if (!match) return;

      if (team === 'A') match.scoreA = e.target.value;
      if (team === 'B') match.scoreB = e.target.value;

      applyScores(match);
    }
  });

  // GENERATE BUTTON
  generateBtn.addEventListener('click', () => {
    const rawPlayers = playersInput.value
      .split('\n')
      .map(p => p.trim())
      .filter(p => p);

    if (rawPlayers.length < 4) {
      alert('Enter at least 4 players');
      return;
    }

    const courts = parseInt(courtsInput.value, 10);
    if (isNaN(courts) || courts < 1) {
      alert('Enter valid number of courts');
      return;
    }

    players = rawPlayers;
    currentRound = 1;

    initLeaderboard();
    generateMatches(courts);
    renderMatches();
    updateLeaderboard();

    matchesSection.classList.remove('hidden');
    leaderboardSection.classList.remove('hidden');
    nextRoundBtn.classList.remove('hidden');
    roundDisplay.classList.remove('hidden');
    roundDisplay.textContent = `Round ${currentRound}`;

    saveState();
    rackySay(rackyBrain.reactions.matchesGenerated);
  });

  // NEXT ROUND
  nextRoundBtn.addEventListener('click', () => {
    currentRound++;
    roundDisplay.textContent = `Round ${currentRound}`;

    const courts = parseInt(courtsInput.value, 10);
    generateMatches(courts);
    renderMatches();

    saveState();
    rackySay(`Round ${currentRound} ready!`);
  });

  // RESET
  resetBtn.addEventListener('click', () => {
    localStorage.removeItem('padelState');
    location.reload();
  });

  // SAVE STATE
  function saveState() {
    const state = {
      players,
      matches,
      leaderboard,
      currentRound,
      mode: modeSelect.value,
      courts: courtsInput.value,
      playersText: playersInput.value
    };
    localStorage.setItem('padelState', JSON.stringify(state));
  }

  // LOAD STATE
  function loadState() {
    const saved = localStorage.getItem('padelState');
    if (!saved) {
      rackySay(rackyBrain.greetings[0]);
      return;
    }

    const state = JSON.parse(saved);

    players = state.players || [];
    matches = state.matches || [];
    leaderboard = state.leaderboard || {};
    currentRound = state.currentRound || 1;
    modeSelect.value = state.mode || 'classic';
    courtsInput.value = state.courts || '';
    playersInput.value = state.playersText || '';

    if (players.length > 0) {
      if (Object.keys(leaderboard).length === 0) {
        initLeaderboard();
      }
      renderMatches();
      updateLeaderboard();
      matchesSection.classList.remove('hidden');
      leaderboardSection.classList.remove('hidden');
      nextRoundBtn.classList.remove('hidden');
      roundDisplay.classList.remove('hidden');
      roundDisplay.textContent = `Round ${currentRound}`;
      rackySay(rackyBrain.reactions.playersAdded);
      if (matches.length > 0) {
        rackySay(rackyBrain.reactions.matchesGenerated);
      }
    } else {
      rackySay(rackyBrain.greetings[0]);
    }
  }

  // Mascot toggle
  document.getElementById("mascotButton").addEventListener("click", () => {
    document.getElementById("mascotPanel").classList.toggle("hidden");
  });

  loadState();
        </script>
  

</body>
</html>
