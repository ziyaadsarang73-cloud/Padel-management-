<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <title>Padel Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            padelGreen: '#9dfc03',
          },
        },
      },
      darkMode: 'class',
    };
  </script>
</head>
<body class="h-full bg-gray-900 text-gray-100">
  <div class="min-h-screen flex flex-col px-4 py-4 max-w-xl mx-auto">
    <header class="mb-4">
      <h1 class="text-2xl font-bold text-padelGreen text-center">Padel Manager</h1>
      <p class="text-xs text-gray-400 text-center mt-1">
        Player randomizer, matches & live leaderboard
      </p>
    </header>

    <!-- Controls -->
    <section class="space-y-4 mb-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Players (one per line)</label>
        <textarea id="playersInput"
          class="w-full h-32 rounded-md bg-gray-800 border border-gray-700 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-padelGreen"
          placeholder="Player 1&#10;Player 2&#10;Player 3&#10;..."></textarea>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex-1">
          <label class="block text-sm font-semibold mb-1">Number of courts</label>
          <input id="courtsInput" type="number" min="1"
            class="w-full rounded-md bg-gray-800 border border-gray-700 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-padelGreen"
            placeholder="e.g. 3" />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-semibold mb-1">Scoring mode</label>
          <select id="modeSelect"
            class="w-full rounded-md bg-gray-800 border border-gray-700 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-padelGreen">
            <option value="classic">Classic</option>
            <option value="americano">Americano</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="generateBtn"
          class="flex-1 bg-padelGreen text-gray-900 font-semibold py-2 rounded-md text-sm active:scale-95 transition">
          Generate Matches
        </button>
        <button id="resetBtn"
          class="flex-1 border border-red-500 text-red-400 font-semibold py-2 rounded-md text-sm active:scale-95 transition">
          Reset
        </button>
      </div>
    </section>

    <!-- Matches & Resting -->
    <section id="matchesSection" class="mb-4 hidden">
      <h2 class="text-lg font-semibold mb-2">Matches</h2>
      <div id="matchesContainer" class="space-y-3"></div>
      <div id="restingContainer" class="mt-3 text-sm text-gray-300"></div>
    </section>

    <!-- Leaderboard -->
    <section id="leaderboardSection" class="mb-4 hidden">
      <h2 class="text-lg font-semibold mb-2">Leaderboard</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-gray-800">
              <th class="px-2 py-1 text-left">#</th>
              <th class="px-2 py-1 text-left">Player</th>
              <th class="px-2 py-1 text-right">Points</th>
              <th class="px-2 py-1 text-right">Matches</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="mt-auto pt-4 text-center text-[10px] text-gray-500">
      Classic: enter sets/games as you like. Americano: total 32 pts per match, team points go to both players.
    </footer>
  </div>

  <script>
    // State
    let players = [];
    let matches = [];
    let leaderboard = {};
    let mode = 'classic';

    const playersInput = document.getElementById('playersInput');
    const courtsInput = document.getElementById('courtsInput');
    const modeSelect = document.getElementById('modeSelect');
    const generateBtn = document.getElementById('generateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const matchesSection = document.getElementById('matchesSection');
    const matchesContainer = document.getElementById('matchesContainer');
    const restingContainer = document.getElementById('restingContainer');
    const leaderboardSection = document.getElementById('leaderboardSection');
    const leaderboardBody = document.getElementById('leaderboardBody');

    modeSelect.addEventListener('change', () => {
      mode = modeSelect.value;
      renderMatches(); // re-render labels if needed
    });

    generateBtn.addEventListener('click', () => {
      const rawPlayers = playersInput.value
        .split('\n')
        .map(p => p.trim())
        .filter(p => p.length > 0);

      const courts = parseInt(courtsInput.value, 10);

      if (rawPlayers.length < 4) {
        alert('Please enter at least 4 players.');
        return;
      }
      if (isNaN(courts) || courts < 1) {
        alert('Please enter a valid number of courts.');
        return;
      }

      players = rawPlayers;
      mode = modeSelect.value;
      initLeaderboard();
      generateMatches(courts);
      renderMatches();
      updateLeaderboard();
      matchesSection.classList.remove('hidden');
      leaderboardSection.classList.remove('hidden');
    });

    resetBtn.addEventListener('click', () => {
      players = [];
      matches = [];
      leaderboard = {};
      playersInput.value = '';
      courtsInput.value = '';
      modeSelect.value = 'classic';
      matchesContainer.innerHTML = '';
      restingContainer.innerHTML = '';
      leaderboardBody.innerHTML = '';
      matchesSection.classList.add('hidden');
      leaderboardSection.classList.add('hidden');
    });

    function initLeaderboard() {
      leaderboard = {};
      players.forEach(p => {
        leaderboard[p] = { points: 0, matches: 0 };
      });
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateMatches(courts) {
      matches = [];
      const shuffled = shuffle(players);
      const groups = [];
      for (let i = 0; i < shuffled.length; i += 4) {
        groups.push(shuffled.slice(i, i + 4));
      }

      const maxMatches = courts; // one match per court per "round"
      const usedGroups = groups.slice(0, maxMatches);
      const resting = groups.slice(maxMatches).flat();

      usedGroups.forEach((group, idx) => {
        if (group.length < 4) {
          // not enough for a full match, all resting
          resting.push(...group);
          return;
        }
        const match = {
          id: idx + 1,
          court: idx + 1,
          players: group,
          // team A: players[0,1], team B: players[2,3]
          scoreA: '',
          scoreB: '',
        };
        matches.push(match);
      });

      // store resting list on section
      renderResting(resting);
    }

    function renderResting(resting) {
      if (!resting || resting.length === 0) {
        restingContainer.innerHTML = '';
        return;
      }
      restingContainer.innerHTML = `
        <div class="mt-2">
          <span class="font-semibold text-padelGreen">Resting:</span>
          <span>${resting.join(', ')}</span>
        </div>
      `;
    }

    function renderMatches() {
      matchesContainer.innerHTML = '';
      matches.forEach(match => {
        const [p1, p2, p3, p4] = match.players;
        const matchDiv = document.createElement('div');
        matchDiv.className = 'rounded-md bg-gray-800 border border-gray-700 p-3 text-sm';

        const modeLabel = mode === 'americano' ? 'Americano (32 pts total)' : 'Classic';

        matchDiv.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <div class="font-semibold">Court ${match.court}</div>
            <div class="text-xs text-gray-400">${modeLabel}</div>
          </div>
          <div class="flex flex-col gap-1 mb-2">
            <div class="flex justify-between">
              <span class="font-semibold text-padelGreen">Team A</span>
              <span>${p1} &amp; ${p2}</span>
            </div>
            <div class="flex justify-between">
              <span class="font-semibold text-padelGreen">Team B</span>
              <span>${p3} &amp; ${p4}</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex-1">
              <label class="block text-xs text-gray-400 mb-1">Team A points</label>
              <input type="number" min="0" class="w-full rounded-md bg-gray-900 border border-gray-700 p-1 text-xs score-input"
                data-match-id="${match.id}" data-team="A" value="${match.scoreA}" />
            </div>
            <div class="flex-1">
              <label class="block text-xs text-gray-400 mb-1">Team B points</label>
              <input type="number" min="0" class="w-full rounded-md bg-gray-900 border border-gray-700 p-1 text-xs score-input"
                data-match-id="${match.id}" data-team="B" value="${match.scoreB}" />
            </div>
          </div>
          <p class="mt-1 text-[10px] text-gray-500">
            In Americano, team points are added to both players on that team.
          </p>
        `;
        matchesContainer.appendChild(matchDiv);
      });

      // Attach listeners to score inputs
      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('input', onScoreChange);
      });
    }

    function onScoreChange(e) {
      const input = e.target;
      const matchId = parseInt(input.getAttribute('data-match-id'), 10);
      const team = input.getAttribute('data-team');
      const value = input.value === '' ? '' : parseInt(input.value, 10);

      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      if (team === 'A') {
        match.scoreA = isNaN(value) ? '' : value;
      } else {
        match.scoreB = isNaN(value) ? '' : value;
      }

      // Optional: enforce 32 total in Americano
      if (mode === 'americano' && match.scoreA !== '' && match.scoreB !== '') {
        const total = match.scoreA + match.scoreB;
        if (total !== 32) {
          input.setCustomValidity('Total points for Americano must be 32.');
        } else {
          input.setCustomValidity('');
        }
      } else {
        input.setCustomValidity('');
      }

      recomputeLeaderboard();
    }

    function recomputeLeaderboard() {
      // reset
      initLeaderboard();

      matches.forEach(match => {
        const [p1, p2, p3, p4] = match.players;
        const a = match.scoreA;
        const b = match.scoreB;

        if (a === '' && b === '') return;

        // Count match played for all 4 players if any score entered
        [p1, p2, p3, p4].forEach(p => {
          leaderboard[p].matches += 1;
        });

        if (mode === 'americano') {
          // Americano: team points go to both players on that team
          const aPts = isNaN(a) ? 0 : a;
          const bPts = isNaN(b) ? 0 : b;

          leaderboard[p1].points += aPts;
          leaderboard[p2].points += aPts;
          leaderboard[p3].points += bPts;
          leaderboard[p4].points += bPts;
        } else {
          // Classic: you can interpret as games/points; here we just add raw numbers
          const aPts = isNaN(a) ? 0 : a;
          const bPts = isNaN(b) ? 0 : b;

          leaderboard[p1].points += aPts;
          leaderboard[p2].points += aPts;
          leaderboard[p3].points += bPts;
          leaderboard[p4].points += bPts;
        }
      });

      updateLeaderboard();
    }

    function updateLeaderboard() {
      const entries = Object.entries(leaderboard);
      entries.sort((a, b) => b[1].points - a[1].points || a[0].localeCompare(b[0]));

      leaderboardBody.innerHTML = '';
      entries.forEach(([name, data], index) => {
        const tr = document.createElement('tr');
        tr.className = index % 2 === 0 ? 'bg-gray-900' : 'bg-gray-800';
        tr.innerHTML = `
          <td class="px-2 py-1">${index + 1}</td>
          <td class="px-2 py-1">${name}</td>
          <td class="px-2 py-1 text-right font-semibold text-padelGreen">${data.points}</td>
          <td class="px-2 py-1 text-right text-gray-300">${data.matches}</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
