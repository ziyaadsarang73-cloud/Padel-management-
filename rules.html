<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Rules</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}

/* Top Tabs */
.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;display:flex;justify-content:center;gap:40px;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-tabs">
<a href="index.html" id="tab-arena">Arena</a>
<a href="leaderboard.html" id="tab-leaderboard">Leaderboard</a>
<a href="rules.html" id="tab-rules">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT RULES</div>

<div class="max-w-4xl mx-auto p-6 space-y-6">
<h2 class="text-xl font-bold">Official Padel Tennis Rules</h2>
<p>Include all official game rules, scoring rules, and randomizer tournament rules...</p>
<!-- Keep all your existing rules content here -->
</div>

<script>
// AUTO-ACTIVE TAB
const path = window.location.pathname.split('/').pop();
if(path === "index.html" || path === "") document.getElementById('tab-arena').classList.add('active');
else if(path === "leaderboard.html") document.getElementById('tab-leaderboard').classList.add('active');
else if(path === "rules.html") document.getElementById('tab-rules').classList.add('active');
</script>

</body>
</html>
