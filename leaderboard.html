<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PadelPilot Leaderboard</title>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}

/* Top Tabs */
.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;display:flex;justify-content:center;gap:40px;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}
.leaderboard-banner{
background:linear-gradient(90deg,#2563eb,#facc15);
color:#0f172a;text-align:center;padding:26px;
font-size:32px;font-weight:900;letter-spacing:.15em;
}

/* Leaderboard Table */
.container{max-width:5xl;margin:0 auto;padding:16px;}
table{width:100%;border-collapse:collapse;font-size:0.95rem;}
th, td{text-align:center;padding:12px 8px;}
th{font-weight:600;opacity:0.8;font-size:0.88rem;}
tr{border-bottom:1px solid rgba(0,0,0,0.08);}
tr:last-child{border-bottom:none;}
.rank-1{color:#ffd700;}
.rank-2{color:#c0c0c0;}
.rank-3{color:#cd7f32;}
.crown-emoji{font-size:1.1rem;margin-right:4px;}
.points{font-weight:700;color:#16a34a;}
.diff-positive{color:#16a34a;}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-tabs">
<a href="index.html">Arena</a>
<a href="leaderboard.html" class="active">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="leaderboard-banner">LEADERBOARD</div>

<div class="container">
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Players</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>P</th>
        <th>+/-</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic leaderboard rows go here -->
    </tbody>
  </table>
</div>

<script>
// Firebase config
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// Get tournament ID from URL
const urlParams = new URLSearchParams(window.location.search);
const meetId = urlParams.get('meet');
if(!meetId) {
  alert("No tournament selected. Go to Arena and share the tournament link.");
}

// Fetch data from Firebase
db.ref('arena/' + meetId).on('value', snapshot => {
  const data = snapshot.val();
  if(!data) return;

  const players = data.players.split('\n').map(p => p.trim()).filter(Boolean);
  const matches = data.matches || [];

  const playerStats = {};
  players.forEach(p => playerStats[p] = {W:0,D:0,L:0,P:0,diff:0});

  // Compute stats based on matches
  matches.forEach(m => {
    const scoreA = parseInt(m.scoreA)||0;
    const scoreB = parseInt(m.scoreB)||0;

    m.teamA.forEach(player=>{
      if(scoreA>scoreB){ playerStats[player].W +=1; }
      else if(scoreA<scoreB){ playerStats[player].L +=1; }
      else { playerStats[player].D +=1; }
      playerStats[player].P += scoreA;
      playerStats[player].diff += scoreA - scoreB;
    });

    m.teamB.forEach(player=>{
      if(scoreB>scoreA){ playerStats[player].W +=1; }
      else if(scoreB<scoreA){ playerStats[player].L +=1; }
      else { playerStats[player].D +=1; }
      playerStats[player].P += scoreB;
      playerStats[player].diff += scoreB - scoreA;
    });
  });

  // Sort players by points descending
  const leaderboardArray = Object.keys(playerStats).map(name=>({
    name,
    ...playerStats[name]
  })).sort((a,b)=>b.P - a.P);

  renderLeaderboard(leaderboardArray);
});

// Render leaderboard table
function renderLeaderboard(players){
  const tbody = document.querySelector('tbody');
  tbody.innerHTML = '';

  players.forEach((p,i)=>{
    const rankClass = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    const row = document.createElement('tr');
    row.className = rankClass;
    row.innerHTML = `
      <td><span class="crown-emoji">👑</span></td>
      <td>${p.name}</td>
      <td>${p.W}</td>
      <td>${p.D}</td>
      <td>${p.L}</td>
      <td class="points">${p.P}</td>
      <td class="diff-positive">${p.diff>0?'+':''}${p.diff}</td>
    `;
    tbody.appendChild(row);
  });
}
</script>

</body>
</html>
