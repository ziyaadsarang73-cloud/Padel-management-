<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PadelPilot Leaderboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #ffffff;
      --banner-bg: linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
      --card-bg: #f1f5f9;
      --text: #0f172a;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --green: #16a34a;
      --accent: #3b82f6;
    }

    * {margin:0;padding:0;box-sizing:border-box;}

    body {
      font-family:'Space Grotesk',sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height:100vh;
      padding:12px;
    }

    /* Top Tabs */
    .top-tabs{
      background: var(--banner-bg);
      padding:14px;
      display:flex;
      justify-content:center;
      gap:40px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .top-tabs a{color:white;text-decoration:none;font-size:13px}
    .top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

    /* Banners */
    .padelpilot-banner{
      background:#0f172a;color:white;text-align:center;padding:18px;
      font-size:22px;font-weight:900;letter-spacing:.2em;
    }
    .leaderboard-banner{
      background:linear-gradient(90deg,#2563eb,#facc15);
      color:#0f172a;text-align:center;padding:26px;
      font-size:32px;font-weight:900;letter-spacing:.15em;
    }

    /* Share Button */
    .share-btn{
      margin:12px 0;
      width:100%;
      white-space:nowrap;
      text-align:center;
      background:var(--accent);
      color:white;
      padding:10px;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
    }

    /* Table */
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      padding:16px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    }

    table {width:100%;border-collapse:collapse;font-size:1rem;margin-top:12px;}
    th, td {padding:12px 8px;text-align:center;}
    th {font-weight:700;opacity:0.8;font-size:0.88rem;}
    tr {border-bottom:1px solid rgba(0,0,0,0.08);}
    tr:last-child {border-bottom:none;}
    .rank-1 {color: var(--gold);}
    .rank-2 {color: var(--silver);}
    .rank-3 {color: var(--bronze);}
    .crown-emoji {font-size:1.1rem;margin-right:4px;}
    .points {font-weight:700;color:var(--green);}
    .diff-positive {color:var(--green);}
    .rounds {
      display:flex;
      justify-content:center;
      gap:12px;
      padding:16px;
      border-top:1px solid rgba(0,0,0,0.08);
    }
    .round-btn {
      padding:8px 16px;
      background:rgba(0,0,0,0.05);
      border:1px solid rgba(0,0,0,0.1);
      border-radius:20px;
      color: var(--text);
      font-size:0.86rem;
      cursor:pointer;
    }
    .round-btn.active {background: var(--accent); border-color: var(--accent); color:white;}
  </style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-tabs">
  <a href="index.html">Arena</a>
  <a href="leaderboard.html" class="active">Leaderboard</a>
  <a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="leaderboard-banner">LEADERBOARD</div>

<div class="container">

  <!-- Share Button -->
  <button id="shareLeaderboardBtn" class="share-btn">Share Leaderboard Link</button>

  <!-- Leaderboard Table -->
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Players</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>P</th>
        <th>+/-</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
      <!-- Filled dynamically from Arena -->
    </tbody>
  </table>

  <!-- Rounds -->
  <div class="rounds" id="roundButtons">
    <!-- Filled dynamically -->
  </div>
</div>

<script>
  // Get tournament ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const meetId = urlParams.get('meet');

  const db = firebase.database ? firebase.database() : null;

  // Sample fallback data
  let leaderboardData = [];

  if(meetId && db){
    // Fetch from Firebase arena matches
    db.ref('arena/'+meetId).get().then(snap=>{
      const data = snap.val();
      if(!data) return;
      const playersRaw = data.players ? data.players.split('\n') : [];
      const matches = data.matches || [];

      // Build simple points table (Americano style: 3 points win, 1 draw)
      let pointsMap = {};
      playersRaw.forEach(p=>pointsMap[p]={W:0,D:0,L:0,P:0,Diff:0});
      matches.forEach(m=>{
        const [a1,a2]=m.teamA;
        const [b1,b2]=m.teamB;
        const sA=parseInt(m.scoreA)||0;
        const sB=parseInt(m.scoreB)||0;

        // Update team A
        if(sA>sB){
          [a1,a2].forEach(p=>{pointsMap[p].W++; pointsMap[p].P+=3; pointsMap[p].Diff+=sA-sB;});
          [b1,b2].forEach(p=>{pointsMap[p].L++; pointsMap[p].Diff+=sB-sA;});
        } else if(sB>sA){
          [b1,b2].forEach(p=>{pointsMap[p].W++; pointsMap[p].P+=3; pointsMap[p].Diff+=sB-sA;});
          [a1,a2].forEach(p=>{pointsMap[p].L++; pointsMap[p].Diff+=sA-sB;});
        } else {
          [a1,a2,b1,b2].forEach(p=>{pointsMap[p].D++; pointsMap[p].P+=1;});
        }
      });

      leaderboardData = Object.entries(pointsMap).map(([name,stats])=>{
        return {name,...stats};
      });

      // Sort by points descending
      leaderboardData.sort((a,b)=>b.P-a.P);

      // Render table
      const tbody=document.getElementById('leaderboardBody');
      tbody.innerHTML='';
      leaderboardData.forEach((p,i)=>{
        let rankClass='';
        if(i===0) rankClass='rank-1';
        else if(i===1) rankClass='rank-2';
        else if(i===2) rankClass='rank-3';
        tbody.innerHTML+=`
          <tr class="${rankClass}">
            <td><span class="crown-emoji">👑</span></td>
            <td>${p.name}</td>
            <td>${p.W}</td>
            <td>${p.D}</td>
            <td>${p.L}</td>
            <td class="points">${p.P}</td>
            <td class="${p.Diff>=0?'diff-positive':''}">${p.Diff>=0?'+':''}${p.Diff}</td>
          </tr>
        `;
      });

      // Render round buttons
      const roundContainer = document.getElementById('roundButtons');
      for(let r=1;r<=10;r++){
        const btn = document.createElement('button');
        btn.textContent = 'Round '+r;
        btn.className='round-btn'+(r===1?' active':'');
        roundContainer.appendChild(btn);
      }
    });
  }

  // Share Leaderboard Link
  document.getElementById('shareLeaderboardBtn').addEventListener('click',()=>{
    if(!meetId) return alert("No tournament selected!");
    const url = location.href.split('?')[0] + "?meet=" + meetId;
    navigator.clipboard.writeText(url)
      .then(()=>alert("Leaderboard link copied!"))
      .catch(()=>alert("Failed to copy link."));
  });
</script>

</body>
</html>
