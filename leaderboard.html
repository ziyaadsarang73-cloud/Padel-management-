<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Leaderboard</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #ffffff;
  font-family: 'Space Grotesk', sans-serif;
  margin: 0;
}

/* Top Tabs */
.top-tabs{
  background: linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
  padding: 14px;
  display: flex;
  justify-content: center;
  gap: 40px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
  background:#0f172a;color:white;text-align:center;padding:18px;
  font-size:22px;font-weight:900;letter-spacing:.2em;
}
.arena-banner{
  background:linear-gradient(90deg,#2563eb,#facc15);
  color:#0f172a;text-align:center;padding:26px;
  font-size:32px;font-weight:900;letter-spacing:.15em;
}

/* Leaderboard */
.container {
  max-width: 5xl;
  margin: 0 auto;
  padding: 24px;
}

.table-container {
  background: #f1f5f9;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1rem;
}

th, td {
  text-align: center;
  padding: 12px 8px;
}

th { font-weight: 700; opacity: 0.8; }

tr { border-bottom: 1px solid rgba(0,0,0,0.08); }
tr:last-child { border-bottom: none; }

.rank-1 { color: #ffd700; font-weight: 900; }
.rank-2 { color: #c0c0c0; font-weight: 900; }
.rank-3 { color: #cd7f32; font-weight: 900; }

.crown-emoji { margin-right: 4px; }

/* Rounds */
.rounds {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 16px;
}

.round-btn {
  padding: 8px 16px;
  background: rgba(59,130,246,0.1);
  border-radius: 20px;
  border: 1px solid rgba(59,130,246,0.3);
  color: #0f172a;
  cursor: pointer;
}

.round-btn.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

/* Share button */
.share-btn {
  margin: 16px auto;
  display: block;
  width: fit-content;
  padding: 10px 24px;
  border-radius: 12px;
  background: #3b82f6;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- Top Tabs -->
<div class="top-tabs">
  <a href="index.html">Arena</a>
  <a href="leaderboard.html" class="active">Leaderboard</a>
  <a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="arena-banner">LEADERBOARD</div>

<div class="container">

  <button class="share-btn" onclick="copyLeaderboardLink()">Share Leaderboard</button>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Player / Team</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>Points</th>
          <th>Diff</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!-- Dynamic content -->
      </tbody>
    </table>
  </div>

  <div class="rounds" id="roundsContainer">
    <!-- Round buttons dynamically added -->
  </div>

</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = new URLSearchParams(window.location.search).get('meet');
if(meetId){
  db.ref('arena/' + meetId).once('value').then(snapshot => {
    const data = snapshot.val();
    if(!data) return;

    const players = data.players.split('\n').filter(p=>p.trim());
    const matches = data.matches || [];

    renderLeaderboard(players, matches);
  });
}

function renderLeaderboard(players, matches){
  const tbody = document.getElementById('leaderboardBody');
  tbody.innerHTML='';

  players.forEach((player,i)=>{
    let rankClass='';
    if(i==0) rankClass='rank-1';
    else if(i==1) rankClass='rank-2';
    else if(i==2) rankClass='rank-3';

    const tr = document.createElement('tr');
    tr.className=rankClass;
    tr.innerHTML=`
      <td><span class="crown-emoji">${i<3?'👑':''}</span></td>
      <td>${player}</td>
      <td>0</td>
      <td>0</td>
      <td>0</td>
      <td>0</td>
      <td>0</td>
    `;
    tbody.appendChild(tr);
  });

  // Rounds
  const roundsContainer = document.getElementById('roundsContainer');
  roundsContainer.innerHTML='';
  for(let r=1;r<=10;r++){
    const btn = document.createElement('button');
    btn.className='round-btn';
    btn.textContent='Round '+r;
    roundsContainer.appendChild(btn);
  }
}

/* Share Leaderboard */
function copyLeaderboardLink(){
  if(!meetId) return alert("No tournament selected");
  const url = location.href.split('?')[0]+'?meet='+meetId;
  navigator.clipboard.writeText(url);
  alert("Leaderboard link copied");
}
</script>

</body>
</html>
