<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Leaderboard</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}

/* Top Tabs */
.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;display:flex;justify-content:center;gap:40px;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}
.arena-banner{
background:linear-gradient(90deg,#2563eb,#facc15);
color:#0f172a;text-align:center;padding:26px;
font-size:32px;font-weight:900;letter-spacing:.15em;
}

/* Tournament Name Floating */
.tournament-title{
text-align:center;
font-size:28px;
font-weight:900;
margin:24px 0 12px 0;
letter-spacing:.1em;
color:#1e40af;
}

/* Podium */
.podium-container{
display:flex;
justify-content:center;
align-items:flex-end;
gap:16px;
margin-bottom:24px;
position:relative;
}
.podium-player{
display:flex;
flex-direction:column;
align-items:center;
font-weight:700;
color:#0f172a;
position:relative;
}
.podium-block{
border-radius:8px;
width:96px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:700;
padding:12px 0;
box-shadow:0 6px 12px rgba(0,0,0,0.15);
}
.rank-1-block{background:#ffd700;height:140px;margin-bottom:0;}
.rank-2-block{background:#c0c0c0;height:110px;margin-bottom:30px;}
.rank-3-block{background:#cd7f32;height:100px;margin-bottom:40px;}
.crown{font-size:28px;margin-bottom:4px;}

/* Scorecard */
.table-container{
max-width:700px;
margin:0 auto 40px auto;
overflow-x:auto;
}
table{
width:100%;
border-collapse:collapse;
font-size:14px;
text-align:center;
}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;}
th{font-weight:700;color:#0f172a;opacity:0.8;}

/* Rounds */
.rounds{
display:flex;justify-content:center;gap:12px;margin-bottom:20px;
}
.round-btn{
padding:6px 14px;
background:rgba(0,0,0,0.05);
border-radius:20px;
border:1px solid rgba(0,0,0,0.1);
font-size:12px;
cursor:pointer;
}
.round-btn.active{
background:#2563eb;
color:white;
border-color:#2563eb;
}

/* Resting Players */
.resting-players{
margin-top:12px;
padding:10px;
background:#fef3c7;
color:#b45309;
border-radius:10px;
font-weight:700;
text-align:center;
}

/* Share Button */
.share-btn{
margin:16px auto;
display:block;
background:#3b82f6;
color:white;
padding:10px 20px;
font-weight:700;
border-radius:10px;
cursor:pointer;
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-tabs">
<a href="index.html">Arena</a>
<a href="leaderboard.html" class="active">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="arena-banner">LEADERBOARD</div>

<!-- Tournament Name -->
<div id="tournamentTitle" class="tournament-title">Tournament Name</div>

<!-- Podium -->
<div class="podium-container" id="podiumContainer"></div>

<!-- Scorecard -->
<div class="table-container">
<table>
<thead>
<tr>
<th>Rank</th>
<th>Player / Team</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>Points</th>
<th>Diff</th>
</tr>
</thead>
<tbody id="scoreTableBody"></tbody>
</table>
</div>

<!-- Rounds -->
<div class="rounds" id="roundsContainer"></div>

<!-- Resting Players -->
<div id="restingPlayersContainer" class="resting-players"></div>

<!-- Share Button -->
<button class="share-btn" onclick="shareLeaderboard()">Share Leaderboard</button>

<script>
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let meetId=null;
let currentMatches=[];
let currentRound=1;

// Get tournament from query parameter if available
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('meet')){
meetId=urlParams.get('meet');
listenTournament();
}

function listenTournament(){
db.ref('arena/'+meetId).on('value',snap=>{
const data=snap.val();
if(!data) return;

// Set tournament name
document.getElementById('tournamentTitle').textContent = data.name||'Tournament Name';

// Players & matches
let rawPlayers = (data.players||'').split('\n').filter(p=>p.trim());
currentMatches = data.matches || [];
renderLeaderboard(rawPlayers,currentMatches);
});
}

function renderLeaderboard(players,matches){
const podiumContainer=document.getElementById('podiumContainer');
const scoreTableBody=document.getElementById('scoreTableBody');
const roundsContainer=document.getElementById('roundsContainer');
const restingContainer=document.getElementById('restingPlayersContainer');

podiumContainer.innerHTML='';
scoreTableBody.innerHTML='';
roundsContainer.innerHTML='';
restingContainer.innerHTML='';

// Calculate points per player (Americano rules)
let scores={};
players.forEach(p=>scores[p]={W:0,D:0,L:0,P:0,Dif:0});
matches.forEach(m=>{
// Team A
m.teamA.forEach(p=>{
scores[p].P += parseInt(m.scoreA)||0;
if((parseInt(m.scoreA)||0)>(parseInt(m.scoreB)||0)) scores[p].W+=1;
else if((parseInt(m.scoreA)||0)==(parseInt(m.scoreB)||0)) scores[p].D+=1;
else scores[p].L+=1;
scores[p].Dif += (parseInt(m.scoreA)||0)-(parseInt(m.scoreB)||0);
});
// Team B
m.teamB.forEach(p=>{
scores[p].P += parseInt(m.scoreB)||0;
if((parseInt(m.scoreB)||0)>(parseInt(m.scoreA)||0)) scores[p].W+=1;
else if((parseInt(m.scoreB)||0)==(parseInt(m.scoreA)||0)) scores[p].D+=1;
else scores[p].L+=1;
scores[p].Dif += (parseInt(m.scoreB)||0)-(parseInt(m.scoreA)||0);
});
});

// Sort by points descending
let sortedPlayers = Object.entries(scores).sort((a,b)=>b[1].P - a[1].P);

// Podium top 3
const podiumRanks=['rank-2-block','rank-1-block','rank-3-block'];
for(let i=0;i<Math.min(3,sortedPlayers.length);i++){
let [name,s] = sortedPlayers[i];
let div=document.createElement('div');
div.className='podium-player';
div.innerHTML=`
<div class="crown">👑</div>
<div class="podium-block ${podiumRanks[i]}">${name}</div>
`;
podiumContainer.appendChild(div);
}

// Full score table
sortedPlayers.forEach(([name,s],idx)=>{
let tr=document.createElement('tr');
tr.innerHTML=`
<td>${idx+1}</td>
<td>${name}</td>
<td>${s.W}</td>
<td>${s.D}</td>
<td>${s.L}</td>
<td>${s.P}</td>
<td>${s.Dif>0?'+':''}${s.Dif}</td>
`;
scoreTableBody.appendChild(tr);
});

// Rounds
for(let r=1;r<=currentMatches.length/Math.max(1,Math.floor(players.length/4));r++){
let btn=document.createElement('button');
btn.className='round-btn'+(r==currentRound?' active':'');
btn.textContent='Round '+r;
roundsContainer.appendChild(btn);
}

// Resting players
const restingPlayers = players.filter(p=>!currentMatches.some(m=>m.teamA.includes(p) || m.teamB.includes(p)));
restingContainer.textContent = restingPlayers.length>0?'Resting Players: '+restingPlayers.join(', '):'';
}

// Share leaderboard
function shareLeaderboard(){
const url=location.href.split('?')[0]+"?meet="+meetId;
navigator.clipboard.writeText(url);
alert("Leaderboard link copied!");
}
</script>
</body>
</html>
