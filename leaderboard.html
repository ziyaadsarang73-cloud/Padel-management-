<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PadelPilot Leaderboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}

/* Top Tabs */
.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;display:flex;justify-content:center;gap:40px;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}
.leaderboard-banner{
background:linear-gradient(90deg,#2563eb,#facc15);
color:#0f172a;text-align:center;padding:26px;
font-size:32px;font-weight:900;letter-spacing:.15em;
}

/* Leaderboard Table */
.container{
max-width:5xl;
margin:0 auto;
padding:24px;
}
.table-container{
background:#1a1a2e;border-radius:24px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.1);color:#e0e0ff;
}
.table-container table{width:100%;border-collapse:collapse;font-size:0.94rem}
.table-container th, .table-container td{padding:12px 8px;text-align:center}
.table-container th{font-weight:600;opacity:0.8;font-size:0.88rem}
.table-container tr{border-bottom:1px solid rgba(255,255,255,0.08)}
.table-container tr:last-child{border-bottom:none}
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }
.points { font-weight:700; color:#00ff9d; }
.diff-positive { color:#00ff9d; }
.player-card{text-align:center;width:96px;margin:0 auto 16px}
.player-initials{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;border:3px solid}
.crown-emoji{font-size:1.1rem;margin-right:4px}
.rounds{display:flex;justify-content:center;gap:12px;padding:16px}
.round-btn{padding:8px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;color:#fff;font-size:0.86rem;cursor:pointer}
.round-btn.active{background:#6c5ce7;border-color:#6c5ce7}
.status-bar{height:34px;background:#000;display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.8rem;color:#aaa;margin-top:12px}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-tabs">
<a href="index.html">Arena</a>
<a href="leaderboard.html" class="active">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="leaderboard-banner">LEADERBOARD</div>

<div class="container">

  <!-- Winner Stats -->
  <div class="stats-row flex justify-center gap-8 mb-6">
    <div class="player-card">
      <div class="crown-emoji">👑</div>
      <div class="player-initials" style="border-color:#ffd700;background:#2a2a4a">MB</div>
      <div>Manuel Beingolea</div>
    </div>
    <div class="player-card">
      <div class="crown-emoji">👑</div>
      <div class="player-initials" style="border-color:#ffd700;background:#3a2a5a">DC</div>
      <div>Diego Cordero</div>
    </div>
    <div class="player-card">
      <div class="crown-emoji">👑</div>
      <div class="player-initials" style="border-color:#cd7f32;background:#3a3a5a">T</div>
      <div>Tata</div>
    </div>
  </div>

  <!-- Leaderboard Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Players</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>P</th>
          <th>+/-</th>
        </tr>
      </thead>
      <tbody>
        <tr class="rank-1">
          <td><span class="crown-emoji">👑</span></td>
          <td>DC Diego Cordero</td>
          <td>4</td>
          <td>0</td>
          <td>3</td>
          <td class="points">95</td>
          <td class="diff-positive">+22</td>
        </tr>
        <tr class="rank-2">
          <td><span class="crown-emoji">👑</span></td>
          <td>MB Manuel Beingolea</td>
          <td>5</td>
          <td>0</td>
          <td>2</td>
          <td class="points">94</td>
          <td class="diff-positive">+20</td>
        </tr>
        <tr class="rank-3">
          <td><span class="crown-emoji">👑</span></td>
          <td>T Tata</td>
          <td>3</td>
          <td>1</td>
          <td>3</td>
          <td class="points">92</td>
          <td class="diff-positive">+16</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Round Buttons -->
  <div class="rounds">
    <button class="round-btn">Round 1</button>
    <button class="round-btn active">Round 2</button>
    <button class="round-btn">Round 3</button>
    <button class="round-btn">Round 4</button>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span>2:50</span> • G • <i class="fa-solid fa-signal"></i> • <i class="fa-solid fa-battery-full"></i>
  </div>

</div>
</body>
</html>
