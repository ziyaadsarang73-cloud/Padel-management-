<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Leaderboard</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#ffffff;font-family:'Space Grotesk',sans-serif;margin:0}

/* Top Tabs */
.top-tabs{
background:linear-gradient(90deg,#1e40af,#3b82f6,#facc15);
padding:14px;display:flex;justify-content:center;gap:40px;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.top-tabs a{color:white;text-decoration:none;font-size:13px}
.top-tabs a.active{border-bottom:3px solid white;padding-bottom:4px}

/* Banners */
.padelpilot-banner{
background:#0f172a;color:white;text-align:center;padding:18px;
font-size:22px;font-weight:900;letter-spacing:.2em;
}
.leaderboard-banner{
background:linear-gradient(90deg,#2563eb,#facc15);
color:#0f172a;text-align:center;padding:26px;
font-size:32px;font-weight:900;letter-spacing:.15em;
}

/* Leaderboard Card UI */
.container{max-width:420px;margin:40px auto;background:#1a1a2e;border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4);color:white}
.header{padding:20px;text-align:center;background:linear-gradient(135deg,#1e1e3a,#2a1e4a)}
.title{font-size:1.2rem;font-weight:700}

.winner-banner{padding:20px;text-align:center;background:rgba(40,167,69,.12)}
.winner-title{font-size:1.3rem;font-weight:700;color:#00ff9d}

.stats-row{display:flex;justify-content:center;gap:20px;padding:20px}
.player-card{text-align:center;width:96px}
.player-initials{
width:64px;height:64px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:1.5rem;font-weight:bold;margin:0 auto 8px;
background:#333366;border:3px solid gold
}

table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:center}
tr{border-bottom:1px solid rgba(255,255,255,.08)}
.points{color:#00ff9d;font-weight:700}
</style>
</head>

<body>

<div class="top-tabs">
<a href="index.html">Arena</a>
<a href="leaderboard.html" class="active">Leaderboard</a>
<a href="rules.html">Rules</a>
</div>

<div class="padelpilot-banner">PADELPILOT</div>
<div class="leaderboard-banner">LEADERBOARD</div>

<div class="container">
<div class="header">
<div class="title">Tournament Standings</div>
</div>

<div id="winnerSection"></div>

<div id="podium" class="stats-row"></div>

<div class="table-container">
<table>
<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>W</th>
<th>L</th>
<th>P</th>
<th>+/-</th>
</tr>
</thead>
<tbody id="leaderboardTable"></tbody>
</table>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
authDomain:"padelpilot-4531f.firebaseapp.com",
databaseURL:"https://padelpilot-4531f-default-rtdb.firebaseio.com",
projectId:"padelpilot-4531f",
storageBucket:"padelpilot-4531f.appspot.com",
messagingSenderId:"866905934997",
appId:"1:866905934997:web:97cb8ebc4ed35f9e41f9c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* LOAD LATEST TOURNAMENT */
db.ref('arena').orderByChild('timestamp').limitToLast(1).once('value',snap=>{
const latest=snap.val();
if(!latest) return;

const meetId=Object.keys(latest)[0];
const data=latest[meetId];

buildLeaderboard(data);
});

/* BUILD LEADERBOARD */
function buildLeaderboard(data){

const players=data.players.split('\n').filter(p=>p.trim());
const matches=data.matches||[];
const type=data.type||'classic';

let stats={};

players.forEach(p=>{
stats[p]={wins:0,losses:0,points:0,against:0,diff:0};
});

matches.forEach(m=>{
let aTotal=parseInt(m.scoreA)||0;
let bTotal=parseInt(m.scoreB)||0;

m.teamA.forEach(p=>{
stats[p].points+=aTotal;
stats[p].against+=bTotal;
});
m.teamB.forEach(p=>{
stats[p].points+=bTotal;
stats[p].against+=aTotal;
});

if(type.includes('classic')){
if(aTotal>bTotal){
m.teamA.forEach(p=>stats[p].wins+=1);
m.teamB.forEach(p=>stats[p].losses+=1);
}else if(bTotal>aTotal){
m.teamB.forEach(p=>stats[p].wins+=1);
m.teamA.forEach(p=>stats[p].losses+=1);
}
}else{
if(aTotal>bTotal){
m.teamA.forEach(p=>stats[p].wins+=1);
m.teamB.forEach(p=>stats[p].losses+=1);
}else{
m.teamB.forEach(p=>stats[p].wins+=1);
m.teamA.forEach(p=>stats[p].losses+=1);
}
}
});

Object.keys(stats).forEach(p=>{
stats[p].diff=stats[p].points-stats[p].against;
});

/* SORT */
let ranked=Object.entries(stats).sort((a,b)=>{
if(type.includes('classic')){
return b[1].wins-a[1].wins || b[1].diff-a[1].diff;
}else{
return b[1].points-a[1].points || b[1].diff-a[1].diff;
}
});

/* PODIUM */
const podium=document.getElementById('podium');
ranked.slice(0,3).forEach(([name],i)=>{
const div=document.createElement('div');
div.className='player-card';
div.innerHTML=`
<div class="player-initials">${name.substring(0,2).toUpperCase()}</div>
<div>${name}</div>
`;
podium.appendChild(div);
});

/* TABLE */
const table=document.getElementById('leaderboardTable');
ranked.forEach(([name,s],i)=>{
const row=document.createElement('tr');
row.innerHTML=`
<td>${i+1}</td>
<td>${name}</td>
<td>${s.wins}</td>
<td>${s.losses}</td>
<td class="points">${s.points}</td>
<td>${s.diff}</td>
`;
table.appendChild(row);
});
}
</script>

</body>
</html>
